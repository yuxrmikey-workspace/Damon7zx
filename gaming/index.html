<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming – DigitalPay</title>
    <meta name="description" content="Recharges et abonnements pour vos jeux préférés.">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-primary: #F8FAFF;
            --bg-card: #FFFFFF;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --border-glass: rgba(79, 70, 229, 0.1);
            --indigo-50: #EEF2FF;
            --indigo-100: #E0E7FF;
            --indigo-600: #4F46E5;
            --indigo-700: #4338CA;
            --black: #111827;
            --text: #1E1B4B;
            --text-soft: #6B7280;
            --text-muted: #9CA3AF;
            --red: #EF4444;
            --green: #10B981;
            --radius: 16px;
            --radius-xl: 24px;
            --shadow-card: 0 4px 20px rgba(79, 70, 229, 0.06);
            --shadow-float: 0 8px 30px rgba(79, 70, 229, 0.1);
            --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: -2;
            filter: blur(120px); opacity: 0.06;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--indigo-600); top: -100px; left: -100px; animation: floatOrb 8s ease-in-out infinite alternate; }
        .orb-2 { width: 400px; height: 400px; background: #A5B4FC; bottom: -100px; right: -100px; animation: floatOrb 10s ease-in-out infinite alternate; }
        .orb-3 { width: 300px; height: 300px; background: #C7D2FE; top: 40%; left: 60%; animation: floatOrb 12s ease-in-out infinite alternate; }
        @keyframes floatOrb {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.2); }
        }

        header.site-header {
            position: sticky; top: 1rem; z-index: 50;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px) saturate(140%);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            margin: 0 auto;
            padding: 0.6rem 1.5rem;
            max-width: 1200px;
            width: calc(100% - 2rem);
            display: flex; align-items: center; justify-content: space-between;
            transition: all var(--transition);
            box-shadow: var(--shadow-card);
        }
        header.site-header.is-scrolled {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow-float);
            border-color: rgba(79, 70, 229, 0.2);
        }
        .brand img { height: 40px; }
        .header-actions { display: flex; align-items: center; gap: 0.75rem; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: center;
            color: var(--indigo-600); font-size: 1.2rem;
            transition: all var(--transition); cursor: pointer; position: relative;
        }
        .icon-btn:hover { background: var(--indigo-600); color: #fff; border-color: transparent; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-muted); position: absolute; bottom: 6px; right: 6px;
            border: 2px solid #fff;
        }
        .status-dot.connected { background: var(--green); }

        .lang-selector-header { position: relative; display: flex; align-items: center; }
        .lang-btn-header {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: center;
            color: var(--indigo-600); font-size: 1.1rem; cursor: pointer;
        }
        .lang-menu-header {
            position: absolute; top: calc(100% + 6px); right: 0;
            background: #fff; border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 6px; width: 140px;
            display: none; flex-direction: column; gap: 2px;
            box-shadow: var(--shadow-float); z-index: 100;
        }
        .lang-menu-header.open { display: flex; }
        .lang-menu-header button {
            display: flex; align-items: center; gap: 8px; padding: 8px 10px;
            background: transparent; color: var(--text); border-radius: 8px;
            font-size: 0.85rem; font-weight: 500; cursor: pointer;
        }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.25);
            backdrop-filter: blur(2px); z-index: 1999;
            opacity: 0; visibility: hidden; transition: all 0.3s; pointer-events: none;
        }
        .sidebar-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
        .sidebar {
            position: fixed; top: 0; right: -420px; width: min(85vw, 420px); height: 100vh;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-glass); border-radius: 24px 0 0 24px;
            z-index: 2000; display: flex; flex-direction: column;
            transition: right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: -4px 0 20px rgba(0,0,0,0.08); overflow-y: auto;
        }
        .sidebar.open { right: 0; }
        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-glass);
        }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: var(--text); }
        .sidebar-logo-badge {
            width: 36px; height: 36px; border-radius: 10px;
            background: linear-gradient(135deg, var(--indigo-50), #FFFFFF);
            display: flex; align-items: center; justify-content: center; padding: 3px;
        }
        .sidebar-logo-badge img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
        .sidebar-logo-text { display: flex; flex-direction: column; line-height: 1.1; }
        .sidebar-logo-text .brand-top { font-size: 1.2rem; font-weight: 700; color: var(--text); }
        .sidebar-logo-text .brand-bottom { font-size: 0.9rem; font-weight: 500; color: var(--text-soft); }
        .sidebar-close {
            width: 30px; height: 30px; border-radius: 50%;
            background: transparent; border: 1px solid var(--border-glass); color: var(--text-soft);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .sidebar-profile { display: none; align-items: center; gap: 10px; margin: 0.6rem 1rem; padding: 0.5rem 0.7rem; background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 10px; }
        body.is-logged .sidebar-profile { display: flex; }
        .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--indigo-100); color: var(--indigo-600); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; }
        .sidebar-user-info { overflow: hidden; flex: 1; }
        .sidebar-user-name { font-weight: 600; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .sidebar-user-email { font-size: 0.7rem; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-auth { display: flex; flex-direction: column; gap: 6px; margin: 0.6rem 1rem; }
        body.is-logged .sidebar-auth { display: none; }
        .btn-login-side {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 0.6rem; border-radius: 50px; background: var(--indigo-600); color: #fff;
            font-weight: 600; font-size: 0.85rem;
        }
        .btn-register-side {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 0.6rem; border-radius: 50px; background: transparent;
            border: 1px solid var(--indigo-600); color: var(--indigo-600); font-weight: 600; font-size: 0.85rem;
        }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: 0.3rem 1rem; }
        .sidebar-section-title { padding: 0.6rem 0 0.3rem; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .sidebar-section-title::after { content: ''; flex: 1; border-bottom: 1px dotted var(--border-glass); }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 0.6rem 0.8rem; border-radius: 50px; margin-bottom: 4px;
            color: var(--text-soft); font-weight: 500; font-size: 0.85rem;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass); position: relative;
            transition: all 0.2s;
        }
        .nav-item i { width: 28px; height: 28px; border-radius: 50%; background: var(--indigo-100); color: var(--indigo-600); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: all 0.2s; }
        .nav-item:hover { background: var(--indigo-50); border-color: var(--indigo-600); transform: translateX(3px); }
        .nav-item.active { background: var(--indigo-100); border-color: var(--indigo-600); font-weight: 600; color: var(--indigo-700); }
        .nav-item.active i { background: var(--indigo-600); color: #fff; }
        .nav-item.active::before {
            content: ''; position: absolute; left: -1rem; top: 50%;
            transform: translateY(-50%); width: 3px; height: 50%;
            background: var(--indigo-600); border-radius: 3px;
        }
        .btn-logout-side {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 0.8rem;
            border-radius: 50px;
            margin-top: 8px;
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: var(--red);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            justify-content: flex-start;
        }
        .btn-logout-side i {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .btn-logout-side:hover {
            background: rgba(239, 68, 68, 0.05);
            border-color: var(--red);
        }
        body.is-logged .btn-logout-side { display: flex; }

        .main-content { flex: 1; padding: 2rem 0; }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(135deg, var(--text), var(--indigo-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
        }
        @media (min-width: 768px) {
            .game-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .game-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
            backdrop-filter: blur(5px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--indigo-600);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.15);
        }
        .game-card .thumb {
            aspect-ratio: 1;
            background: var(--indigo-50);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0;
        }
        .game-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .game-card:hover .thumb img { transform: scale(1.08); }
        .game-card .info {
            padding: 0.8rem 1rem 1rem;
            background: #fff;
            border-top: 1px solid var(--border-glass);
        }
        .game-card .info h3 {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
            color: var(--text);
        }
        .game-card .info p {
            color: var(--indigo-600);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
        }
        .game-card .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--indigo-600);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 10;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }

        .modal {
            background: #fff;
            border-radius: var(--radius-xl);
            width: min(92%, 560px);
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem 1.5rem;
            box-shadow: var(--shadow-float);
            border: 1px solid var(--border-glass);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-soft);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: var(--indigo-600);
            color: #fff;
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.5rem;
        }
        .modal-header .modal-game-logo {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: var(--indigo-50);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .modal-header .modal-game-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-header .modal-game-info h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }
        .modal-header .modal-game-info p {
            font-size: 0.85rem;
            color: var(--text-soft);
        }

        .offers-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .offers-category {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .offer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            background: var(--bg-glass);
            cursor: pointer;
            transition: all 0.2s;
        }
        .offer-item:hover {
            border-color: var(--indigo-600);
            background: var(--indigo-50);
        }
        .offer-item.selected {
            border-color: var(--indigo-600);
            background: var(--indigo-100);
        }
        .offer-item .offer-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text);
        }
        .offer-item .offer-price {
            color: var(--indigo-600);
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .delivery-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }
        .form-group input {
            padding: 0.7rem 1rem;
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-add-cart {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.9rem;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--indigo-600), #6D28D9);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-add-cart:hover {
            background: linear-gradient(135deg, #6D28D9, var(--indigo-600));
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }
        .btn-add-cart:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .floating-cart {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--indigo-600);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-float);
            cursor: pointer;
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            transition: all 0.3s;
        }
        .floating-cart.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }
        .floating-cart:hover {
            background: var(--indigo-700);
            transform: scale(1.1);
        }
        .floating-cart .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--red);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: var(--text);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-float);
            border: 1px solid var(--border-glass);
            font-weight: 500;
            font-size: 0.9rem;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 3s forwards;
            max-width: 300px;
        }
        .toast i { font-size: 1.2rem; }
        .toast-info i { color: var(--indigo-600); }
        .toast-success i { color: var(--green); }
        .toast-error i { color: var(--red); }
        .toast-loading i { color: var(--indigo-600); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(20px); } }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar" role="dialog" aria-modal="true" aria-label="Menu de navigation">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span class="sidebar-logo-badge"><img src="/assets/logo.png" alt="DigitalPay Haiti" onerror="this.style.display='none'"></span>
                <span class="sidebar-logo-text">
                    <span class="brand-top">DigitalPay</span>
                    <span class="brand-bottom">Haiti</span>
                </span>
            </div>
            <button class="sidebar-close" id="closeSidebar" type="button"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="sidebar-profile">
            <div class="sidebar-avatar" id="sidebarAvatar"><i class="fa-solid fa-user"></i></div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebarUserName">Nom d'utilisateur</div>
                <div class="sidebar-user-email" id="sidebarUserEmail">email@exemple.com</div>
            </div>
        </div>
        <div class="sidebar-auth">
            <a href="/authentification/login.html" class="btn-login-side"><i class="fa-solid fa-right-to-bracket"></i> Se Connecter</a>
            <a href="/authentification/register.html" class="btn-register-side"><i class="fa-solid fa-user-plus"></i> S'inscrire</a>
        </div>

        <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <header class="site-header" id="siteHeader">
        <a href="/index.html" class="brand"><img src="/assets/logo.png" alt="DigitalPay" onerror="this.style.display='none'"></a>
        <div class="header-actions">

        function openOfferModal(game) {
            currentGame = game;
            selectedOffer = null;
            addToCartBtn.disabled = true;
            deliveryForm.innerHTML = '';

            modalHeader.innerHTML = `
                <div class="modal-game-logo"><img src="${game.logo}" alt="${game.name}" onerror="this.style.display='none'"></div>
                <div class="modal-game-info"><h2>${game.name}</h2><p>${game.description}</p></div>
            `;

            offersContainer.innerHTML = '';
            if (game.categories.length === 0) {
                offersContainer.innerHTML = `<p style="text-align:center;color:var(--text-soft);">${t('noOffers')}</p>`;
            } else {
                game.categories.forEach(category => {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'offers-category';
                    catTitle.textContent = category.name;
                    offersContainer.appendChild(catTitle);

                    category.offers.forEach(offer => {
                        const item = document.createElement('div');
                        item.className = 'offer-item';
                        item.innerHTML = `<span class="offer-name">${offer.name}</span><span class="offer-price">${offer.price}</span>`;
                        item.addEventListener('click', () => {
                            $$('.offer-item').forEach(el => el.classList.remove('selected'));
                            item.classList.add('selected');
                            selectedOffer = offer;
                            showDeliveryForm(category);
                        });
                        offersContainer.appendChild(item);
                    });
                });
            }
            modalOverlay.classList.add('open');
        }

        function showDeliveryForm(category) {
            const fields = category.deliveryFields || currentGame.deliveryFields || [];
            if (fields.length === 0) {
                deliveryForm.innerHTML = '';
                addToCartBtn.disabled = false;
                return;
            }

            let html = '';
            fields.forEach(field => {
                html += `<div class="form-group"><label>${t(field)}</label><input type="text" name="${field}" placeholder="${t(field)}"></div>`;
            });
            deliveryForm.innerHTML = html;
            addToCartBtn.disabled = false;
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            currentGame = null;
            selectedOffer = null;
            addToCartBtn.disabled = true;
            deliveryForm.innerHTML = '';
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        addToCartBtn.addEventListener('click', () => {
            if (!currentGame || !selectedOffer) return;
            const inputs = deliveryForm.querySelectorAll('input');
            const deliveryData = {};
            inputs.forEach(input => deliveryData[input.name] = input.value.trim());
            const required = currentGame.deliveryFields || [];
            for (const f of required) {
                if (!deliveryData[f]) { showToast('Veuillez remplir tous les champs', 'error'); return; }
            }
            addToCart(currentGame, selectedOffer, deliveryData);
            closeModal();
        });

            localStorage.setItem('digitalpay_cart', JSON.stringify(cart));
            updateCartCount();

            document.getElementById('cartCount').textContent = cart.length;
            if (cart.length > 0) document.getElementById('floatingCartBtn').classList.add('show');
            else document.getElementById('floatingCartBtn').classList.remove('show');
        }
        function addToCart(game, offer, deliveryData) {
            cart.push({ id: Date.now(), game: game.name, logo: game.logo, offer: offer.name, price: offer.price, delivery: deliveryData });
            saveCart();
            showToast(t('addedToCart'), 'success');
        }
        document.getElementById('floatingCartBtn').addEventListener('click', () => window.location.href = '/panier.html');

            const nav = document.getElementById('sidebarNav');

                    nav.appendChild(link);
                });
            });
            const logoutBtn = document.createElement('button');
            logoutBtn.className = 'btn-logout-side';
            logoutBtn.id = 'logoutBtn';
            logoutBtn.innerHTML = '<i class="fa-solid fa-arrow-right-from-bracket"></i> Se Déconnecter';
            nav.appendChild(logoutBtn);

            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            document.getElementById('openSidebarBtn').addEventListener('click', () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('open'); });
            function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); }
            document.getElementById('closeSidebar').addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

            const langBtn = document.getElementById('langBtnHeader');
            const langMenu = document.getElementById('langMenuHeader');
            langBtn.addEventListener('click', (e) => { e.stopPropagation(); langMenu.classList.toggle('open'); });
            document.addEventListener('click', (e) => { if (!langMenu.contains(e.target)) langMenu.classList.remove('open'); });
            langMenu.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => applyLanguage(btn.dataset.lang)));

            document.addEventListener('click', (e) => {
                if (e.target.closest('#logoutBtn')) {
                    e.preventDefault();
                    if (auth.currentUser) {
                        auth.signOut().then(() => window.location.href = '/index.html');
                    } else window.location.href = '/authentification/login.html';
                }
            });

            auth.onAuthStateChanged(user => {
                if (user) {
                    document.body.classList.add('is-logged');
                    document.getElementById('sidebarUserName').textContent = user.displayName || 'Membre';
                    document.getElementById('sidebarUserEmail').textContent = user.email || '';
                } else document.body.classList.remove('is-logged');
            });

            window.addEventListener('scroll', () => {
                document.getElementById('siteHeader').classList.toggle('is-scrolled', window.scrollY > 10);
            }, { passive: true });

            applyLanguage(getCurrentLang());
        });
