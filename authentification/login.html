<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Connexion - DigitalPay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-page: #0b0b12; --bg-glass: rgba(255, 255, 255, 0.04);
            --bg-soft: rgba(255, 255, 255, 0.02); --bg-card: rgba(26, 29, 44, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --navy-50: #1E3050; --navy-100: #2A4068; --navy-400: #60A5FA;
            --navy-600: #2563EB; --navy-700: #1D4ED8; --navy-900: #0B132B;
            --text: #F8FAFC; --text-soft: #94A3B8; --muted: #64748B;
            --whatsapp: #25D366; --radius: 16px; --radius-lg: 24px; --radius-xl: 28px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6); --shadow-float: 0 12px 40px rgba(0, 0, 0, 0.8);
            --container: 1180px; --gap: 16px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-page); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        .container { max-width: var(--container); margin: 0 auto; padding: 0 20px; }

        /* ORBES */
        body::before { content: ''; position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,255,255,0.006) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.006) 1px, transparent 1px); background-size: 50px 50px; }
        .orb-1 { position: fixed; width: 600px; height: 600px; background: var(--navy-600); filter: blur(140px); opacity: 0.12; top: -200px; left: -200px; z-index: -1; pointer-events: none; animation: float1 15s ease-in-out infinite alternate; }
        .orb-2 { position: fixed; width: 500px; height: 500px; background: var(--navy-400); filter: blur(120px); opacity: 0.10; bottom: -150px; right: -150px; z-index: -1; pointer-events: none; animation: float2 20s ease-in-out infinite alternate; }
        @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 150px) scale(1.3); } }
        @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-80px, -120px) scale(1.2); } }

        /* HEADER */
        header.site-header { position: sticky; top: 1rem; z-index: 10; background: var(--bg-glass); backdrop-filter: blur(16px) saturate(150%); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); margin: 0 1.2rem; padding: 0 1.8rem; height: 68px; display: flex; align-items: center; transition: all 0.3s ease; }
        header.site-header.is-scrolled { background: rgba(11, 11, 18, 0.8); box-shadow: var(--shadow-float); backdrop-filter: blur(20px); }
        .brand img { height: 44px; width: auto; display: block; }

        /* CARTE AUTH */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 40px 30px; max-width: 420px; width: 100%; box-shadow: var(--shadow-card); backdrop-filter: blur(12px); }
        .auth-card h1 { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; margin-bottom: 8px; text-align: center; }
        .auth-card .sub { color: var(--text-soft); text-align: center; margin-bottom: 24px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-soft); }
        .form-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 12px; color: var(--text); font-size: 1rem; transition: 0.3s; outline: none; }
        .form-group input:focus { border-color: var(--navy-600); background: rgba(37,99,235,0.05); }
        .form-group input::placeholder { color: var(--muted); }
        .btn-primary { width: 100%; padding: 14px; background: var(--navy-600); color: white; font-weight: 600; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: var(--navy-700); transform: translateY(-2px); }
        .auth-links { margin-top: 20px; text-align: center; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
        .auth-links a { color: var(--navy-600); font-weight: 500; transition: 0.2s; }
        .auth-links a:hover { color: #fff; text-decoration: underline; }
        .back-home { color: var(--text-soft) !important; font-weight: 400 !important; }
        .back-home:hover { color: var(--text) !important; }

        /* TOAST */
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-glass); padding: 14px 24px; border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 12px; opacity: 0; transform: translateX(-50%) translateY(30px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; z-index: 9999; min-width: 300px; justify-content: center; }
        .toast-container.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast-container i { font-size: 20px; }
        .toast-container.error { border-color: #ef4444; }
        .toast-container.error i { color: #ef4444; }
        .toast-container.success { border-color: #22c55e; }
        .toast-container.success i { color: #22c55e; }
        .toast-container.info { border-color: var(--navy-600); }
        .toast-container.info i { color: var(--navy-600); }
        .toast-container span { font-weight: 600; font-size: 14px; color: var(--text); }

        /* FALLBACK LOGO */
        .logo-fallback { height: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--navy-600); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; }
        .logo-fallback::after { content: ''; width: 40%; height: 40%; background: rgba(255,255,255,0.4); border-radius: 50%; }
    </style>
</head>
<body>

    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="toast-container" id="toastContainer">
        <i class="fa-solid fa-circle-info" id="toastIcon"></i>
        <span id="toastMessage">Message</span>
    </div>

    <header class="site-header" id="siteHeader">
        <div class="container">
            <a href="/" class="brand">
                <img src="/assets/sidebar-logo.png" alt="DigitalPay" onerror="this.replaceWith(makeLogoFallback(false));">
            </a>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1>Connexion</h1>
            <p class="sub">Accédez à votre compte DigitalPay</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" placeholder="exemple@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Se connecter</button>
            </form>
            <div class="auth-links">
                <a href="/authentification/register.html">Pas encore de compte ? S'inscrire</a>
                <a href="/" class="back-home"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>
            </div>
        </div>
    </main>

    <script>
        function makeLogoFallback(isSidebar) {
            const span = document.createElement('span');
            span.className = 'logo-fallback';
            if (isSidebar) span.classList.add('sidebar');
            return span;
        }
        window.makeLogoFallback = makeLogoFallback;

        const toastContainer = document.getElementById('toastContainer');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        function showToast(message, type = 'info') {
            toastMessage.textContent = message;
            toastContainer.className = 'toast-container';
            if(type === 'success') { toastContainer.classList.add('success'); toastIcon.className = 'fa-solid fa-circle-check'; }
            else if(type === 'error') { toastContainer.classList.add('error'); toastIcon.className = 'fa-solid fa-circle-exclamation'; }
            else { toastContainer.classList.add('info'); toastIcon.className = 'fa-solid fa-circle-info'; }
            toastContainer.classList.add('show');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => { toastContainer.classList.remove('show'); }, 3500);
        }

        const header = document.getElementById('siteHeader');
        window.addEventListener('scroll', () => header.classList.toggle('is-scrolled', window.scrollY > 8), { passive: true });

             /* === FIREBASE AUTH === */
        (function () {
            const cfg = {
                apiKey: "AIzaSyB9o8-LYeKrg2q84dxQM5Z1wFKHjt9yHFo",
                authDomain: "digital-pay-haiti.firebaseapp.com",
                projectId: "digital-pay-haiti",
                appId: appId: "1:182015693140:web:8a2486b9446bfb791bf8c1",
            };

            document.addEventListener('DOMContentLoaded', () => {
                if (!window.firebase) return;
                try { firebase.initializeApp(cfg); } catch (_) {}
                const auth = firebase.auth();
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    auth.signInWithEmailAndPassword(email, password)
                        .then(() => { showToast('Connexion réussie !', 'success'); setTimeout(() => { window.location.href = '/'; }, 1500); })
                        .catch((err) => { showToast('Erreur : ' + err.message, 'error'); });
                });
            });
        })();
    </script>
</body>
</html>
