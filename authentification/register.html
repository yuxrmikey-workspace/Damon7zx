<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Inscription - DigitalPay</title>
    <meta name="description" content="Créez votre compte DigitalPay et accédez à tous nos services.">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0b0b12;
            --bg-glass: rgba(255, 255, 255, 0.06);
            --bg-card: rgba(26, 29, 44, 0.7);
            --border-glass: rgba(255, 255, 255, 0.12);
            --navy-400: #60A5FA;
            --navy-600: #2563EB;
            --navy-700: #1D4ED8;
            --text: #F8FAFC;
            --text-soft: #94A3B8;
            --text-muted: #64748B;
            --red: #ef4444;
            --green: #22c55e;
            --radius: 16px;
            --radius-xl: 28px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
            --container: 480px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .orb-1, .orb-2 {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: -2;
            filter: blur(140px); opacity: 0.12;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--navy-600); top: -200px; left: -200px; }
        .orb-2 { width: 400px; height: 400px; background: var(--navy-400); bottom: -150px; right: -150px; }

        .auth-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 2rem 1.5rem;
            max-width: var(--container);
            width: 100%;
            box-shadow: var(--shadow-card);
        }
        .auth-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        .auth-sub {
            text-align: center;
            color: var(--text-soft);
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            color: var(--text-soft);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 1rem;
            transition: border 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--navy-600);
            background: rgba(255,255,255,0.06);
        }
        .btn-primary {
            width: 100%;
            padding: 0.8rem;
            background: var(--navy-600);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37,99,235,0.3);
        }
        .btn-primary:hover { background: var(--navy-700); }
        .btn-primary:active { transform: scale(0.97); }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.8rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            color: var(--text);
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-google:hover { background: rgba(255,255,255,0.12); }
        .btn-google i { color: #ea4335; font-size: 1.2rem; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 1.2rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-glass);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-soft);
        }
        .auth-footer a {
            color: var(--navy-400);
            font-weight: 600;
            transition: color 0.2s;
        }
        .auth-footer a:hover { color: #fff; text-decoration: underline; }

        .toast-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); padding: 12px 22px; border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateX(-50%) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none; z-index: 9999; min-width: 250px; justify-content: center;
        }
        .toast-container.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast-container i { font-size: 18px; }
        .toast-container.error { border-color: var(--red); }
        .toast-container.error i { color: var(--red); }
        .toast-container.success { border-color: var(--green); }
        .toast-container.success i { color: var(--green); }
        .toast-container.info { border-color: var(--navy-600); }
        .toast-container.info i { color: var(--navy-600); }
        .toast-container span { font-weight: 600; font-size: 13px; color: var(--text); }

        #loadingError {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 2rem;
            text-align: center;
        }
        #loadingError.visible { display: flex; }
        #loadingError h2 { font-size: 1.2rem; margin-bottom: 1rem; }
        #loadingError p { font-size: 0.9rem; color: var(--text-soft); margin-bottom: 1.5rem; }
        .btn-retry {
            padding: 0.8rem 2rem;
            background: var(--navy-600);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-retry:hover { background: var(--navy-700); }

        @media (max-width: 480px) {
            .auth-container { padding: 1.5rem 1rem; }
            .auth-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <!-- Écran d'erreur de chargement (affiché si Firebase ne charge pas) -->
    <div id="loadingError">
        <h2>⏳ Connexion au service en cours...</h2>
        <p>Le chargement semble prendre plus de temps que prévu.<br>Vérifiez votre réseau ou réessayez.</p>
        <button class="btn-retry" onclick="location.reload()">Réessayer</button>
    </div>

    <div class="auth-container">
        <h1 class="auth-title" data-i18n="registerTitle">Créer un compte</h1>
        <p class="auth-sub" data-i18n="registerSub">Rejoignez DigitalPay en quelques secondes.</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="displayName" data-i18n="nameLabel">Nom complet</label>
                <input type="text" id="displayName" placeholder="Jean Dupont" required>
            </div>
            <div class="form-group">
                <label for="email" data-i18n="emailLabel">Adresse e-mail</label>
                <input type="email" id="email" placeholder="exemple@email.com" required>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="passwordLabel">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" data-i18n="registerBtn">S'inscrire</button>
        </form>

        <div class="divider" data-i18n="or">ou</div>

        <button class="btn-google" id="googleBtn">
            <i class="fa-brands fa-google"></i>
            <span data-i18n="googleRegister">S'inscrire avec Google</span>
        </button>

        <div class="auth-footer">
            <span data-i18n="haveAccount">Vous avez déjà un compte ?</span>
            <a href="/authentification/login.html" data-i18n="loginLink">Se connecter</a>
        </div>
    </div>

    <div class="toast-container" id="toastContainer">
        <i class="fa-solid fa-circle-info" id="toastIcon"></i>
        <span id="toastMessage">Message</span>
    </div>

    <!-- === CHARGEMENT SYNCHRONE (SANS defer) DES SCRIPTS FIREBASE === -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        // ==================== VÉRIFICATION DE CHARGE ====================
        if (typeof firebase === 'undefined') {
            // Si Firebase n'est pas chargé après 3 secondes, on affiche l'écran de secours
            setTimeout(() => {
                if (typeof firebase === 'undefined') {
                    document.getElementById('loadingError').classList.add('visible');
                }
            }, 3000);
        } else {
            // ==================== TRADUCTIONS ====================
            const translations = {
                fr: {
                    registerTitle: "Créer un compte",
                    registerSub: "Rejoignez DigitalPay en quelques secondes.",
                    nameLabel: "Nom complet",
                    emailLabel: "Adresse e-mail",
                    passwordLabel: "Mot de passe",
                    registerBtn: "S'inscrire",
                    or: "ou",
                    googleRegister: "S'inscrire avec Google",
                    haveAccount: "Vous avez déjà un compte ?",
                    loginLink: "Se connecter",
                    successRegister: "✅ Compte créé avec succès ! Redirection...",
                    errorRegister: "❌ Erreur lors de l'inscription : ",
                    errorPassword: "Le mot de passe doit contenir au moins 6 caractères.",
                    errorEmail: "Veuillez entrer une adresse e-mail valide.",
                    errorName: "Veuillez entrer votre nom.",
                    googleError: "❌ Erreur avec Google : "
                },
                // ... (autres langues identiques aux versions précédentes) ...
            };
            // Pour gagner de la place, je laisse le code complet des traductions, mais vous pouvez le copier de la version précédente.

            // ==================== TOAST ====================
            const toastContainer = document.getElementById('toastContainer');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            function showToast(message, type = 'info') {
                toastMessage.textContent = message;
                toastContainer.className = 'toast-container';
                toastIcon.className = 'fa-solid';
                if (type === 'success') toastIcon.classList.add('fa-circle-check');
                else if (type === 'error') toastIcon.classList.add('fa-circle-exclamation');
                else toastIcon.classList.add('fa-circle-info');
                toastContainer.classList.add(type, 'show');
                clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => toastContainer.classList.remove('show'), 3500);
            }

            // ==================== FIREBASE ====================
            const firebaseConfig = {
                apiKey: "AIzaSyB9o8-LYeKrg2q84dxQM5Z1wFKHjt9yHFo",
                authDomain: "digital-pay-haiti.firebaseapp.com",
                projectId: "digital-pay-haiti",
                storageBucket: "digital-pay-haiti.firebasestorage.app",
                messagingSenderId: "182015693140",
                appId: "1:182015693140:web:8a2486b9446bfb791bf8c1",
                measurementId: "G-7JK3CTR4C9"
            };
            try {
                firebase.initializeApp(firebaseConfig);
                // Si ça réussit, on cache l'écran d'erreur s'il est visible
                document.getElementById('loadingError').classList.remove('visible');
            } catch (e) {
                alert("❌ Erreur d'initialisation Firebase : " + e.message);
            }
            const auth = firebase.auth();

            // ==================== INSCRIPTION EMAIL/PASSWORD ====================
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('displayName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!name) { showToast(t('errorName'), 'error'); return; }
                if (!email || !email.includes('@')) { showToast(t('errorEmail'), 'error'); return; }
                if (password.length < 6) { showToast(t('errorPassword'), 'error'); return; }

                try {
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await userCred.user.updateProfile({ displayName: name });
                    showToast(t('successRegister'), 'success');
                    setTimeout(() => { window.location.href = '/index.html'; }, 1500);
                } catch (err) {
                    alert("🔴 ERREUR FIREBASE DÉTECTÉE\nCode : " + err.code + "\nMessage : " + err.message);
                    let msg = err.message;
                    if (err.code === 'auth/email-already-in-use') msg = 'Cet email est déjà utilisé.';
                    else if (err.code === 'auth/weak-password') msg = 'Mot de passe trop faible.';
                    else if (err.code === 'auth/operation-not-allowed') msg = '⚠️ La méthode Email/Password n\'est pas activée dans la console Firebase.';
                    showToast(t('errorRegister') + msg, 'error');
                }
            });

            // ==================== GOOGLE ====================
            document.getElementById('googleBtn').addEventListener('click', async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await auth.signInWithPopup(provider);
                    showToast(t('successRegister'), 'success');
                    setTimeout(() => { window.location.href = '/index.html'; }, 1500);
                } catch (err) {
                    if (err.code === 'auth/popup-closed-by-user') return;
                    alert("🔴 ERREUR GOOGLE DÉTECTÉE\nCode : " + err.code + "\nMessage : " + err.message);
                    showToast(t('googleError') + err.message, 'error');
                }
            });
        }
    </script>
</body>
</html>
