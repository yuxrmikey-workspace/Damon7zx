<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Créer un compte — DigitalPay Haiti</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    /* FINTECH DESIGN SYSTEM */
    :root {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --text-black: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --royal-blue: #1D4ED8;
      --royal-gradient: linear-gradient(135deg, #1D4ED8 0%, #2563EB 50%, #3B82F6 100%);
      --royal-soft: rgba(29, 78, 216, 0.08);
      --danger: #DC2626;
      --danger-soft: rgba(220, 38, 38, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-black); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
    .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FFFFFF; position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-light); border-right: 1px solid var(--border-light); }
    .icon-svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; display: inline-block; vertical-align: middle; }

    .site-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 10px 16px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
    .brand-logo-only { height: 34px; width: auto; max-width: 120px; object-fit: contain; cursor: pointer; }

    .auth-main { padding: 24px 20px 40px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .auth-heading { font-size: 24px; font-weight: 900; color: var(--text-black); letter-spacing: -0.6px; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 20px; }

    .btn-google { width: 100%; height: 48px; background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; font-weight: 700; color: var(--text-black); cursor: pointer; box-shadow: var(--shadow-sm); font-family: inherit; margin-bottom: 18px; }
    .btn-google:active { background: var(--surface-subtle); transform: scale(0.99); }
    .btn-google svg { width: 18px; height: 18px; }

    .auth-separator { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .auth-separator::before, .auth-separator::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
    .auth-separator span { font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.6px; }

    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-label { font-size: 11px; font-weight: 800; color: var(--text-black); text-transform: uppercase; letter-spacing: 0.5px; }
    .input-wrapper { position: relative; }
    .input-field { width: 100%; height: 44px; background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 40px 0 14px; font-size: 13px; font-weight: 600; color: var(--text-black); outline: none; font-family: inherit; }
    .input-field:focus { background: #FFFFFF; border-color: var(--royal-blue); box-shadow: 0 0 0 3px var(--royal-soft); }
    .input-toggle-eye { position: absolute; right: 12px; top: 13px; background: none; border: none; color: var(--text-light); cursor: pointer; }

    .terms-box { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-top: 2px; }
    .terms-box input { accent-color: var(--royal-blue); margin-top: 2px; cursor: pointer; }

    .btn-submit-register { width: 100%; height: 46px; background: var(--royal-gradient); color: #FFFFFF; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25); font-family: inherit; margin-top: 6px; }
    .btn-submit-register:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .auth-footer-text a { color: var(--royal-blue); font-weight: 800; text-decoration: none; }

    #toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300; width: calc(100% - 32px); max-width: 380px; pointer-events: none; }
    .toast-pro { background: #0F172A; color: #FFFFFF; padding: 12px 16px; border-radius: var(--radius-md); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); transform: translateY(-20px); opacity: 0; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .toast-pro.toast-danger { background: #991B1B; border-left: 4px solid #EF4444; }
    .toast-pro.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="app-shell">
    <header class="site-header">
      <div class="header-top">
        <a href="../index.html">
          <img src="../logo.png" alt="DigitalPay Logo" class="brand-logo-only" onerror="this.src='../assets/logo.png'; this.onerror=null;">
        </a>
      </div>
    </header>

    <main class="auth-main">
      <h1 class="auth-heading">Créer un compte</h1>
      <p class="auth-sub">Rejoignez DigitalPay pour effectuer vos recharges de jeux et gérer votre portefeuille sans délai.</p>

      <button type="button" class="btn-google" onclick="registerWithGoogle()">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>S'inscrire avec Google</span>
      </button>

      <div class="auth-separator"><span>ou avec votre email</span></div>

      <form class="auth-form" onsubmit="handleEmailRegister(event)">
        <div class="input-group">
          <label class="input-label" for="reg-name">Nom complet</label>
          <div class="input-wrapper">
            <input type="text" id="reg-name" class="input-field" placeholder="Jean-Baptiste Dupont" required autocomplete="name">
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="reg-email">Adresse Email</label>
          <div class="input-wrapper">
            <input type="email" id="reg-email" class="input-field" placeholder="exemple@domaine.com" required autocomplete="email">
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="reg-password">Mot de passe</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" class="input-field" placeholder="Minimum 6 caractères" required minlength="6" autocomplete="new-password">
            <button type="button" class="input-toggle-eye" onclick="togglePasswordVisibility('reg-password')">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="reg-confirm-password">Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <input type="password" id="reg-confirm-password" class="input-field" placeholder="Retapez le mot de passe" required minlength="6" autocomplete="new-password">
            <button type="button" class="input-toggle-eye" onclick="togglePasswordVisibility('reg-confirm-password')">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="terms-box">
          <input type="checkbox" id="reg-terms" required>
          <label for="reg-terms">J'accepte les Conditions d'Utilisation et la politique de confidentialité.</label>
        </div>

        <button type="submit" class="btn-submit-register" id="btn-submit-register">
          <span>Créer mon compte</span>
        </button>
      </form>

      <div class="auth-footer-text">
        <span>Vous avez déjà un compte ?</span> <a href="login.html">Se connecter</a>
      </div>
    </main>
  </div>

  <script>
    /* 1. CONFIGURATION OFFICIELLE */
    const firebaseConfig = {
      apiKey: "AIzaSyDOSMtCknVXQs3XL1piE047Ussc6KeCDmY",
      authDomain: "digitalpayht-officiel.firebaseapp.com",
      projectId: "digitalpayht-officiel",
      storageBucket: "digitalpayht-officiel.firebasestorage.app",
      messagingSenderId: "492314684302",
      appId: "1:492314684302:web:dc36ab9445877df2dcd2df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Verrou pour empêcher toute redirection tant que Firestore n'a pas confirmé l'écriture
    let isWritingToFirestore = false;

    function showToast(text, isDanger = false) {
      const container = document.getElementById('toast-container');
      container.innerHTML = '';
      const toast = document.createElement('div');
      toast.className = `toast-pro ${isDanger ? 'toast-danger' : ''}`;
      toast.innerHTML = `
        <svg class="icon-svg" viewBox="0 0 24 24" style="stroke:${isDanger ? '#FCA5A5' : '#10B981'};">
          ${isDanger 
            ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' 
            : '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>'}
        </svg>
        <span>${text}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 250);
      }, 2500);
    }

    function togglePasswordVisibility(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    /* INSCRIPTION EMAIL + CRÉATION AUTOMATIQUE DANS USERS */
    async function handleEmailRegister(event) {
      event.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;
      const btn = document.getElementById('btn-submit-register');

      if (pass !== confirmPass) {
        showToast("Les mots de passe ne correspondent pas.", true);
        return;
      }

      btn.disabled = true;
      btn.innerText = "Création du profil...";
      isWritingToFirestore = true; // Verrouille la redirection automatique

      try {
        // 1. Création du compte dans Firebase Authentication
        const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
        const user = userCredential.user;

        await user.updateProfile({ displayName: name });

        // 2. ÉCRITURE STRICTEMENT ATTENDUE DANS FIRESTORE
        await db.collection('users').doc(user.uid).set({
          uid: user.uid,
          displayName: name,
          email: email,
          walletBalance: 0,
          createdAt: new Date().toISOString()
        });

        showToast("Compte et portefeuille créés !");
        
        // Redirection APRÈS la confirmation de Firestore
        setTimeout(() => {
          window.location.href = "../index.html";
        }, 1000);

      } catch (err) {
        isWritingToFirestore = false;
        btn.disabled = false;
        btn.innerText = "Créer mon compte";
        
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') msg = "Cette adresse email est déjà enregistrée.";
        if (err.code === 'auth/weak-password') msg = "Le mot de passe doit comporter au moins 6 caractères.";
        showToast(msg, true);
      }
    }

    /* INSCRIPTION GOOGLE + CRÉATION AUTOMATIQUE */
    async function registerWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      isWritingToFirestore = true;

      try {
        const res = await auth.signInWithPopup(provider);
        const user = res.user;

        // Écriture du profil s'il n'existe pas
        await db.collection('users').doc(user.uid).set({
          uid: user.uid,
          displayName: user.displayName || 'Utilisateur DigitalPay',
          email: user.email,
          walletBalance: 0,
          createdAt: new Date().toISOString()
        }, { merge: true });

        showToast("Connexion réussie !");
        setTimeout(() => window.location.href = "../index.html", 1000);
      } catch (err) {
        isWritingToFirestore = false;
        showToast(err.message, true);
      }
    }

    /* ÉCOUTEUR AUTH QUI NE COUPE PLUS L'ÉCRITURE */
    auth.onAuthStateChanged(user => {
      // Si l'utilisateur ouvre register.html alors qu'il est déjà connecté
      if (user && !isWritingToFirestore) {
        window.location.href = "../index.html";
      }
    });
  </script>
</body>
</html>
