    <style>
        :root {
            --bg-primary: #0b0b12;
            --bg-glass: rgba(255, 255, 255, 0.06);
            --bg-card: rgba(26, 29, 44, 0.7);
            --border-glass: rgba(255, 255, 255, 0.12);
            --navy-400: #60A5FA;
            --navy-600: #2563EB;
            --navy-700: #1D4ED8;
            --text: #F8FAFC;
            --text-soft: #94A3B8;
            --text-muted: #64748B;
            --whatsapp: #25D366;
            --red: #ef4444;
            --orange: #f59e0b;
            --green: #22c55e;
            --radius: 16px;
            --radius-xl: 28px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        :focus-visible { outline: 2px solid var(--navy-600); outline-offset: 2px; }

        /* Orbes avec effet parallaxe */
        .orb-1, .orb-2 { position: fixed; border-radius: 50%; pointer-events: none; z-index: -2; filter: blur(140px); opacity: 0.1; will-change: transform; transition: transform 0.2s ease-out; }
        .orb-1 { width: 500px; height: 500px; background: var(--navy-600); top: -150px; left: -150px; }
        .orb-2 { width: 400px; height: 400px; background: var(--navy-400); bottom: -100px; right: -100px; }

        /* Carte register */
        .register-card {
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: var(--shadow-card), 0 0 40px rgba(37,99,235,0.15);
            animation: fadeUp 0.6s cubic-bezier(0.2,0.8,0.2,1) forwards;
            position: relative;
            transition: transform 0.3s ease;
        }
        .register-card:hover {
            transform: perspective(1000px) rotateX(1deg) rotateY(-1deg);
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .register-card .logo { display: flex; justify-content: center; margin-bottom: 24px; }
        .register-card .logo img { height: 44px; width: auto; }
        .register-card h2 {
            font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 22px;
            text-align: center; margin-bottom: 8px; color: var(--text);
        }
        .register-card .subtitle { text-align: center; color: var(--text-soft); font-size: 14px; margin-bottom: 28px; }

        /* Champs */
        .input-group { margin-bottom: 16px; position: relative; }
        .input-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-soft); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-group input {
            width: 100%; padding: 12px 16px; padding-right: 42px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass);
            border-radius: var(--radius); color: var(--text); font-size: 15px;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; outline: none;
        }
        .input-group input:focus { border-color: var(--navy-600); background: rgba(37,99,235,0.05); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .input-group input::placeholder { color: var(--text-muted); font-size: 14px; }
        .input-group input.error { border-color: var(--red); background: rgba(239,68,68,0.05); }
        .input-group input.valid { border-color: var(--green); }

        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); cursor: pointer; font-size: 16px; transition: color 0.2s;
            background: none; border: none; padding: 4px;
        }
        .toggle-password:hover { color: var(--text); }

        .input-feedback {
            display: flex; align-items: center; gap: 6px; font-size: 12px;
            margin-top: 6px; min-height: 18px; transition: all 0.2s;
        }
        .input-feedback.error { color: var(--red); }
        .input-feedback.success { color: var(--green); }
        .input-feedback i { font-size: 12px; }

        /* Barre de force du mot de passe */
        .password-strength { margin-top: 6px; }
        .password-strength .bar {
            height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1);
            margin-bottom: 4px; overflow: hidden; transition: all 0.3s;
        }
        .password-strength .bar-fill {
            height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s;
            width: 0%; background: var(--red);
        }
        .password-strength .text { font-size: 11px; color: var(--text-muted); transition: color 0.3s; }

        /* Bouton */
        .btn-submit {
            width: 100%; padding: 14px; background: var(--navy-600); color: #fff;
            border: none; border-radius: var(--radius); font-weight: 700; font-size: 16px;
            transition: background 0.2s, transform 0.2s, opacity 0.2s; margin-top: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover:not(:disabled) { background: var(--navy-700); transform: scale(1.01); }
        .btn-submit:active:not(:disabled) { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Liens */
        .extra-links { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-soft); }
        .extra-links a { color: var(--navy-600); font-weight: 600; transition: color 0.2s; }
        .extra-links a:hover { color: var(--navy-400); text-decoration: underline; }
        .back-home { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); transition: color 0.2s; }
        .back-home:hover { color: var(--text-soft); }

        /* Message "déjà connecté" */
        .already-logged { text-align: center; padding: 20px 0; display: none; }
        .already-logged.show { display: block; }
        .already-logged i { font-size: 48px; color: var(--navy-600); margin-bottom: 12px; display: block; }
        .already-logged p { color: var(--text-soft); font-size: 14px; }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); padding: 14px 24px; border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 12px;
            opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none; z-index: 9999; min-width: 280px; justify-content: center;
        }
        .toast-container.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast-container i { font-size: 20px; }
        .toast-container.error { border-color: #ef4444; }
        .toast-container.error i { color: #ef4444; }
        .toast-container.success { border-color: #22c55e; }
        .toast-container.success i { color: #22c55e; }
        .toast-container.info { border-color: var(--navy-600); }
        .toast-container.info i { color: var(--navy-600); }
        .toast-container span { font-weight: 600; font-size: 14px; color: var(--text); }

        /* Langue */
        .lang-dropdown { position: absolute; top: 20px; right: 20px; }
        .lang-btn {
            width: 38px; height: 38px; border-radius: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass);
            color: var(--text); display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; transition: all 0.2s; padding: 0;
        }
        .lang-btn:hover { background: var(--navy-600); border-color: transparent; }
        .lang-options {
            position: absolute; top: calc(100% + 6px); right: 0;
            background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-glass);
            border-radius: var(--radius); padding: 6px; min-width: 160px;
            display: flex; flex-direction: column; gap: 2px;
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.25s ease; z-index: 20;
        }
        .lang-dropdown.open .lang-options { opacity: 1; visibility: visible; transform: translateY(0); }
        .lang-options button {
            padding: 8px 12px; border-radius: 10px; background: transparent; color: var(--text-soft);
            font-weight: 500; font-size: 13px; transition: background 0.2s; text-align: left;
            display: flex; align-items: center; gap: 8px;
        }
        .lang-options button:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .lang-options button.active { background: var(--navy-600); color: #fff; }

        /* Fallback logo */
        .logo-fallback {
            height: 44px; width: 44px; border-radius: 50%; background: var(--navy-600);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .logo-fallback::after { content: ''; width: 40%; height: 40%; background: rgba(255,255,255,0.4); border-radius: 50%; }

        @media (max-width: 360px) {
            .register-card { padding: 28px 20px; }
        }

</head>
<body>

    <!-- Carte d'inscription -->

        <h2 data-i18n="title">Inscription</h2>
        <p class="subtitle" data-i18n="subtitle">Créez votre compte DigitalPay</p>

        <div class="already-logged" id="alreadyLogged">
            <i class="fa-solid fa-circle-check"></i>
            <p data-i18n="alreadyLogged">Vous êtes déjà connecté. Redirection...</p>
        </div>

        <form id="registerForm" novalidate>
            <!-- Nom d'utilisateur -->
            <div class="input-group">
                <label for="username" data-i18n="usernameLabel">Nom d'utilisateur</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" data-i18n-placeholder="usernamePlaceholder" placeholder="Votre nom" autocomplete="username" aria-describedby="usernameFeedback" maxlength="30">
                </div>
                <div class="input-feedback" id="usernameFeedback" aria-live="polite"></div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label for="email" data-i18n="emailLabel">Adresse e-mail</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" data-i18n-placeholder="emailPlaceholder" placeholder="exemple@email.com" autocomplete="email" aria-describedby="emailFeedback">
                </div>
                <div class="input-feedback" id="emailFeedback" aria-live="polite"></div>
            </div>

            <!-- Mot de passe -->
            <div class="input-group">
                <label for="password" data-i18n="passwordLabel">Mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" data-i18n-placeholder="passwordPlaceholder" placeholder="Minimum 6 caractères" autocomplete="new-password" aria-describedby="passwordFeedback passwordStrength">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher le mot de passe">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="input-feedback" id="passwordFeedback" aria-live="polite"></div>
                <div class="password-strength" id="passwordStrength">
                    <div class="bar"><div class="bar-fill" id="strengthBar"></div></div>
                    <div class="text" id="strengthText" data-i18n="strengthEmpty"></div>
                </div>
            </div>

            <!-- Confirmer mot de passe -->
            <div class="input-group">
                <label for="confirmPassword" data-i18n="confirmLabel">Confirmer le mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" data-i18n-placeholder="confirmPlaceholder" placeholder="Répétez le mot de passe" autocomplete="new-password" aria-describedby="confirmFeedback">
                    <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Afficher le mot de passe">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="input-feedback" id="confirmFeedback" aria-live="polite"></div>
            </div>

            <button type="submit" class="btn-submit" id="registerBtn">
                <i class="fa-solid fa-user-plus"></i>
                <span data-i18n="registerBtn">S'inscrire</span>
            </button>
        </form>

        <div class="extra-links">
            <p data-i18n="hasAccount">Déjà un compte ?</p>
            <a href="/authentification/login.html" data-i18n="loginLink">Se connecter</a>
        </div>

        <a href="/" class="back-home" data-i18n="backHome">← Retour à l'accueil</a>
    </div>

    <!-- Toast -->

        <i class="fa-solid fa-circle-info" id="toastIcon"></i>
        <span id="toastMessage">Message</span>

        let currentLang = 'fr';

        function t(key) {
            return (translations[currentLang] && translations[currentLang][key]) ? translations[currentLang][key] : key;
        }

        function applyLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) el.setAttribute('placeholder', translations[lang][key]);
            });
            updateToggleAriaLabels();
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
        }

        function updateToggleAriaLabels() {
            const pw = document.getElementById('password');
            const cpw = document.getElementById('confirmPassword');
            const tb1 = document.getElementById('togglePassword');
            const tb2 = document.getElementById('toggleConfirmPassword');
            if (tb1 && pw) tb1.setAttribute('aria-label', pw.type === 'password' ? t('showPassword') : t('hidePassword'));
            if (tb2 && cpw) tb2.setAttribute('aria-label', cpw.type === 'password' ? t('showPassword') : t('hidePassword'));
        }

        // ==================== GESTION LANGUE ====================
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const langOptions = document.querySelectorAll('.lang-options button');
        const langFlags = { fr: '🇫🇷', en: '🇺🇸', ht: '🇭🇹', es: '🇪🇸' };

        function setActiveLang(lang) {
            langBtn.textContent = langFlags[lang] || lang.toUpperCase();
            langOptions.forEach(b => {
                b.classList.remove('active');
                if (b.dataset.lang === lang) b.classList.add('active');
            });
        }

        langBtn.addEventListener('click', (e) => { e.stopPropagation(); langDropdown.classList.toggle('open'); });
        document.addEventListener('click', () => langDropdown.classList.remove('open'));
        langOptions.forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.dataset.lang;
                applyLanguage(lang);
                setActiveLang(lang);
                langDropdown.classList.remove('open');
            });
        });

        // ==================== TOAST ====================
        const toastContainer = document.getElementById('toastContainer');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        function showToast(message, type = 'info') {
            toastMessage.textContent = message;
            toastContainer.className = 'toast-container';
            toastIcon.className = 'fa-solid';
            if (type === 'success') toastIcon.classList.add('fa-circle-check');
            else if (type === 'error') toastIcon.classList.add('fa-circle-exclamation');
            else toastIcon.classList.add('fa-circle-info');
            toastContainer.classList.add(type, 'show');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toastContainer.classList.remove('show'), 4000);
        }

        // ==================== TOGGLE PASSWORD ====================
        function setupToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            btn.addEventListener('click', () => {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                btn.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
                btn.setAttribute('aria-label', type === 'password' ? t('showPassword') : t('hidePassword'));
            });
        }
        setupToggle('togglePassword', 'password');
        setupToggle('toggleConfirmPassword', 'confirmPassword');

        // ==================== FORCE DU MOT DE PASSE ====================
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        function evaluateStrength(password) {
            let score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            let width = 0, color = 'var(--red)', textKey = 'strengthEmpty';
            if (password.length === 0) { width = 0; color = 'var(--red)'; textKey = 'strengthEmpty'; }
            else if (score <= 2) { width = 25; color = 'var(--red)'; textKey = 'strengthWeak'; }
            else if (score === 3) { width = 60; color = 'var(--orange)'; textKey = 'strengthMedium'; }
            else { width = 100; color = 'var(--green)'; textKey = 'strengthStrong'; }

            strengthBar.style.width = width + '%';
            strengthBar.style.background = color;
            strengthText.textContent = t(textKey);
            strengthText.style.color = color;
        }

        // ==================== VALIDATION DES CHAMPS ====================
        function setFieldState(input, feedback, isValid, messageKey) {
            input.classList.remove('error', 'valid');
            feedback.className = 'input-feedback';
            feedback.textContent = '';
            if (input.value.trim() === '') return false;
            if (!isValid) {
                input.classList.add('error');
                feedback.className = 'input-feedback error';
                feedback.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${t(messageKey)}`;
                return false;
            }
            input.classList.add('valid');
            feedback.className = 'input-feedback success';
            feedback.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            return true;
        }

        function validateUsername() {
            const input = document.getElementById('username');
            const feedback = document.getElementById('usernameFeedback');
            const val = input.value.trim();
            if (!val) return false;
            const valid = val.length >= 3 && val.length <= 30 && /^[A-Za-zÀ-ÿ0-9 \-]+$/.test(val);
            return setFieldState(input, feedback, valid, val.length < 3 ? 'errorUsernameShort' : 'errorUsername');
        }

        function validateEmail() {
            const input = document.getElementById('email');
            const feedback = document.getElementById('emailFeedback');
            const val = input.value.trim();
            if (!val) return false;
            const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
            return setFieldState(input, feedback, valid, 'errorEmail');
        }

        function validatePassword() {
            const input = document.getElementById('password');
            const feedback = document.getElementById('passwordFeedback');
            const val = input.value;
            if (!val) return false;
            evaluateStrength(val);
            const valid = val.length >= 6;
            return setFieldState(input, feedback, valid, 'errorPassword');
        }

        function validateConfirmPassword() {
            const input = document.getElementById('confirmPassword');
            const feedback = document.getElementById('confirmFeedback');
            const pw = document.getElementById('password').value;
            const val = input.value;
            if (!val) return false;
            const valid = val === pw;
            return setFieldState(input, feedback, valid, 'errorPasswordMatch');
        }

        document.getElementById('username').addEventListener('input', validateUsername);
        document.getElementById('username').addEventListener('blur', validateUsername);
        document.getElementById('email').addEventListener('input', validateEmail);
        document.getElementById('email').addEventListener('blur', validateEmail);
        document.getElementById('password').addEventListener('input', () => {
            validatePassword();
            if (document.getElementById('confirmPassword').value) validateConfirmPassword();
        });
        document.getElementById('password').addEventListener('blur', validatePassword);
        document.getElementById('confirmPassword').addEventListener('input', validateConfirmPassword);
        document.getElementById('confirmPassword').addEventListener('blur', validateConfirmPassword);

        // ==================== INSCRIPTION ====================
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const u = validateUsername();
            const em = validateEmail();
            const p = validatePassword();
            const cp = validateConfirmPassword();

            if (!u || !em || !p || !cp) {
                if (!document.getElementById('username').value.trim() || !document.getElementById('email').value.trim() || !document.getElementById('password').value || !document.getElementById('confirmPassword').value) {
                    showToast(t('errorEmpty'), 'error');
                }
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span data-i18n="registering">Inscription en cours...</span>';
            applyLanguage(currentLang);

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    return userCredential.user.updateProfile({ displayName: username });
                })
                .then(() => {
                    showToast(t('successRegister'), 'success');
                    setTimeout(() => { window.location.href = '/index.html'; }, 1500);
                })
                .catch((error) => {
                    console.error('Register error:', error);
                    let message = t('errorRegister');
                    if (error.code === 'auth/email-already-in-use') message = t('errorEmailUsed');
                    else if (error.code === 'auth/invalid-email') message = t('errorEmail');
                    else if (error.code === 'auth/weak-password') message = t('errorPassword');
                    showToast(message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> <span data-i18n="registerBtn">S\'inscrire</span>';
                    applyLanguage(currentLang);
                });
        });

        // ==================== PARALLAXE ====================
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            document.getElementById('orb1').style.transform = `translate(${x}px, ${y}px)`;
            document.getElementById('orb2').style.transform = `translate(${-x * 0.6}px, ${-y * 0.6}px)`;
        });

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', () => {
            let savedLang = localStorage.getItem('lang');
            if (!savedLang) {
                const browserLang = navigator.language.split('-')[0];
                savedLang = ['fr', 'en', 'ht', 'es'].includes(browserLang) ? browserLang : 'fr';
            }
            applyLanguage(savedLang);
            setActiveLang(savedLang);
            document.getElementById('username').focus();

            auth.onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('registerForm').style.display = 'none';
                    document.querySelector('.extra-links').style.display = 'none';
                    document.querySelector('.subtitle').style.display = 'none';
                    document.getElementById('alreadyLogged').classList.add('show');
                    setTimeout(() => { window.location.href = '/index.html'; }, 2000);
                }
            });
        });
    </script>
</body>
</html>
