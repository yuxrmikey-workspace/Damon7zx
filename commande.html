<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Historique des Commandes — DigitalPay Haiti</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs Compat 10.12.0 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    /* FINTECH DESIGN SYSTEM IDENTIQUE À INDEX.HTML */
    :root {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --border: #E2E8F0;
      --border-light: #F1F5F9;

      --text-black: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;

      --royal-blue: #1D4ED8;
      --royal-gradient: linear-gradient(135deg, #1D4ED8 0%, #2563EB 50%, #3B82F6 100%);
      --royal-soft: rgba(29, 78, 216, 0.08);

      --danger: #DC2626;
      --danger-soft: rgba(220, 38, 38, 0.08);
      --success: #10B981;
      --success-soft: rgba(16, 185, 129, 0.08);
      --warning: #F59E0B;
      --warning-soft: rgba(245, 158, 11, 0.08);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-square: 16px;
      --radius-card: 18px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-black); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
    .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FFFFFF; position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-light); border-right: 1px solid var(--border-light); }
    .icon-svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; display: inline-block; vertical-align: middle; }

    /* HEADER IDENTIQUE À INDEX.HTML */
    .site-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 10px 16px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
    .brand-logo-only { height: 34px; width: auto; max-width: 120px; object-fit: contain; cursor: pointer; }
    .header-icons { display: flex; align-items: center; gap: 6px; }
    .header-btn { width: 38px; height: 38px; border-radius: var(--radius-md); background: #FFFFFF; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-black); cursor: pointer; position: relative; text-decoration: none; transition: transform 0.15s ease; }
    .header-btn:active { transform: scale(0.94); background: var(--surface-subtle); }
    .header-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .badge-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--royal-blue); box-shadow: 0 0 0 2px #FFFFFF; display: none; }
    .badge-num { position: absolute; top: -3px; right: -3px; background: var(--royal-blue); color: #FFFFFF; font-size: 10px; font-weight: 800; width: 17px; height: 17px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; }

    /* CORPS COMMANDES */
    .orders-main { padding: 20px 16px 40px; flex: 1; display: flex; flex-direction: column; }
    .orders-header-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .orders-title { font-size: 20px; font-weight: 900; color: var(--text-black); letter-spacing: -0.5px; }
    .orders-count-badge { background: var(--surface-subtle); border: 1px solid var(--border); color: var(--royal-blue); font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: var(--radius-full); }

    /* FILTRES RAPIDES */
    .filter-pills-bar { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
    .filter-pills-bar::-webkit-scrollbar { display: none; }
    .filter-pill { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 6px 14px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; font-family: inherit; transition: all 0.15s ease; }
    .filter-pill.active { background: var(--text-black); border-color: var(--text-black); color: #FFFFFF; }

    /* LISTE DES COMMANDES */
    .orders-list { display: flex; flex-direction: column; gap: 12px; }
    .order-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order-card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .order-brand-zone { display: flex; align-items: center; gap: 12px; }
    .order-thumb { width: 44px; height: 44px; border-radius: var(--radius-square); overflow: hidden; background: var(--surface-subtle); border: 1px solid var(--border-light); flex-shrink: 0; }
    .order-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .order-item-title { font-size: 13px; font-weight: 800; color: var(--text-black); line-height: 1.2; }
    .order-item-offer { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .order-price { font-size: 14px; font-weight: 900; color: var(--royal-blue); text-align: right; white-space: nowrap; }

    /* STATUTS */
    .status-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-top: 3px;
    }
    .status-pill.livre { background: var(--success-soft); color: var(--success); }
    .status-pill.en_attente { background: var(--warning-soft); color: var(--warning); }
    .status-pill.rejete { background: var(--danger-soft); color: var(--danger); }

    /* DÉTAILS DE LIVRAISON */
    .order-details-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .order-detail-line { display: flex; justify-content: space-between; gap: 8px; }
    .order-detail-key { color: var(--text-muted); font-weight: 600; }
    .order-detail-val { font-weight: 800; color: var(--text-black); text-align: right; word-break: break-all; }

    /* COFFRE PIN FREE FIRE (EXPIRATION 24H) */
    .pin-vault-box {
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.04) 0%, rgba(37, 99, 235, 0.08) 100%);
      border: 1px solid rgba(29, 78, 216, 0.2);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pin-vault-header { display: flex; align-items: center; justify-content: space-between; }
    .pin-vault-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--royal-blue); }
    .pin-code-display {
      font-family: monospace;
      font-size: 15px;
      font-weight: 900;
      color: var(--royal-blue);
      letter-spacing: 1px;
      padding: 6px 10px;
      background: #FFFFFF;
      border: 1px dashed rgba(29, 78, 216, 0.3);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-copy-pin {
      background: var(--royal-blue);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-redeem-link {
      height: 36px;
      background: var(--royal-gradient);
      color: #FFFFFF;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      margin-top: 2px;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2);
    }
    .pin-expired-notice {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      text-align: center;
      font-weight: 600;
    }

    /* EMPTY STATE */
    .empty-orders-box { text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; }
    .empty-orders-box svg { width: 48px; height: 48px; stroke: var(--text-light); margin-bottom: 12px; }
    .empty-title { font-size: 15px; font-weight: 800; color: var(--text-black); margin-bottom: 4px; }
    .empty-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; max-width: 260px; line-height: 1.4; }
    .btn-go-shop { background: var(--royal-gradient); color: #FFFFFF; padding: 10px 24px; border-radius: var(--radius-md); font-size: 13px; font-weight: 800; text-decoration: none; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2); }

    /* FOOTER IDENTIQUE À INDEX.HTML */
    .site-footer { background: #FFFFFF; border-top: 1px solid var(--border); padding: 18px 16px; margin-top: auto; }
    .footer-minimal-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .footer-status-pill { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--royal-blue); text-transform: uppercase; letter-spacing: 0.5px; }
    .footer-status-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--royal-blue); }

    /* SIDEBAR-MENU IDENTIQUE À INDEX.HTML */
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.25s ease; }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar-drawer { position: fixed; top: 0; right: 0; width: min(82vw, 340px); height: 100vh; background: #FFFFFF; z-index: 101; transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08); }
    .sidebar-overlay.active .sidebar-drawer { transform: translateX(0); }
    .sidebar-content { padding: 24px 20px; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
    .sidebar-header-pro { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .sidebar-brand-box { display: flex; align-items: center; gap: 12px; }
    .logo-container-square { width: 44px; height: 44px; border-radius: var(--radius-square); background: var(--surface-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .logo-container-square img { width: 100%; height: 100%; object-fit: contain; }
    .sidebar-brand-title { font-size: 16px; font-weight: 900; color: #000000; letter-spacing: -0.4px; }
    .sidebar-brand-sub { font-size: 12px; font-weight: 700; color: #000000; letter-spacing: 0.5px; }
    .sidebar-close-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; font-weight: 800; }
    .sidebar-section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-light); margin: 16px 0 8px; }
    .lang-switcher-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .lang-option { background: var(--surface-subtle); border: 1px solid var(--border); padding: 7px 10px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-black); cursor: pointer; }
    .lang-option.active { border-color: var(--royal-blue); background: var(--royal-soft); color: var(--royal-blue); font-weight: 800; }
    .sidebar-menu-nav { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
    .menu-link { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--radius-md); color: var(--text-black); text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.15s ease; cursor: pointer; }
    .menu-link:hover, .menu-link.active { background: var(--surface-subtle); color: var(--royal-blue); }
    .menu-link svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .sidebar-auth-zone { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn-auth { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; border-radius: var(--radius-md); font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn-login { background: var(--royal-gradient); color: #FFFFFF; margin-bottom: 8px; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2); }
    .btn-register { background: #FFFFFF; border: 1px solid var(--border); color: var(--text-black); }
    .btn-logout { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.2); }

    /* TOAST */
    #toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300; width: calc(100% - 32px); max-width: 380px; pointer-events: none; }
    .toast-pro { background: #0F172A; color: #FFFFFF; padding: 12px 16px; border-radius: var(--radius-md); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); transform: translateY(-20px); opacity: 0; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .toast-pro.toast-danger { background: #991B1B; border-left: 4px solid #EF4444; }
    .toast-pro.show { transform: translateY(0); opacity: 1; }

    /* NOTIF PANEL GLOBAL */
    .notif-panel { position: absolute; top: 64px; right: 16px; width: calc(100% - 32px); max-width: 360px; background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.08); z-index: 60; display: none; padding: 14px; }
    .notif-panel.open { display: block; }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="app-shell">

    <!-- HEADER IDENTIQUE À INDEX.HTML -->
    <header class="site-header">
      <div class="header-top">
        <a href="index.html">
          <img src="logo.png" alt="DigitalPay Logo" class="brand-logo-only" onerror="this.src='assets/logo.png'; this.onerror=null;">
        </a>

        <div class="header-icons">
          <button class="header-btn" onclick="protectLink('cart.html')" aria-label="Panier">
            <svg viewBox="0 0 24 24">
              <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="badge-num" id="cart-indicator">0</span>
          </button>

          <button class="header-btn" onclick="toggleNotifications()" aria-label="Notifications">
            <svg viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="badge-dot" id="notif-dot"></span>
          </button>

          <button class="header-btn" onclick="openSidebar()" aria-label="Menu">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- VOLET DE NOTIFICATIONS EN DIRECT -->
    <div class="notif-panel" id="notif-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong style="font-size:12px; text-transform:uppercase;">Annonces Globales</strong>
        <button onclick="toggleNotifications()" style="border:none; background:none; cursor:pointer; font-weight:700;">✕</button>
      </div>
      <div style="padding:10px; background:var(--surface-subtle); border-left:3px solid var(--royal-blue); border-radius:4px; font-size:12px;">
        <strong id="notif-broadcast-heading">Diffusion Administrateur</strong>
        <p id="notif-broadcast-text">Suivez l'état de livraison de vos commandes en temps réel.</p>
      </div>
    </div>

    <!-- CORPS COMMANDES -->
    <main class="orders-main">
      <div class="orders-header-title">
        <h1 class="orders-title" id="txt-page-title">Mes Commandes</h1>
        <span class="orders-count-badge" id="orders-count-badge">0</span>
      </div>

      <!-- FILTRES DE STATUT -->
      <div class="filter-pills-bar">
        <button class="filter-pill active" data-filter="all" onclick="setOrdersFilter('all', this)" id="btn-filter-all">Toutes</button>
        <button class="filter-pill" data-filter="en_attente" onclick="setOrdersFilter('en_attente', this)" id="btn-filter-pending">En cours</button>
        <button class="filter-pill" data-filter="livre" onclick="setOrdersFilter('livre', this)" id="btn-filter-delivered">Livrées</button>
      </div>

      <div class="orders-list" id="orders-container-target">
        <div class="empty-orders-box">
          <div style="font-size:12px; color:var(--text-muted); font-weight:600;">Chargement des commandes en cours...</div>
        </div>
      </div>
    </main>

    <!-- FOOTER IDENTIQUE À INDEX.HTML -->
    <footer class="site-footer">
      <div class="footer-minimal-row">
        <span>© 2026 DigitalPay S.A.</span>
        <div class="footer-status-pill">
          <span class="footer-status-indicator"></span>
          <span>Système 24/7</span>
        </div>
      </div>
    </footer>

    <!-- SIDEBAR-MENU IDENTIQUE À INDEX.HTML -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()">
      <aside class="sidebar-drawer" onclick="event.stopPropagation()">
        <div class="sidebar-content">
          
          <div class="sidebar-header-pro">
            <div class="sidebar-brand-box">
              <div class="logo-container-square">
                <img src="logo.png" alt="DigitalPay Logo" onerror="this.src='assets/logo.png'; this.onerror=null;">
              </div>
              <div>
                <div class="sidebar-brand-title">DigitalPay</div>
                <div class="sidebar-brand-sub">Haiti</div>
              </div>
            </div>
            <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
          </div>

          <div class="sidebar-section-title">Langue / Lang</div>
          <div class="lang-switcher-grid">
            <button class="lang-option active" onclick="setLang('fr', this)"><span>🇫🇷</span> Français</button>
            <button class="lang-option" onclick="setLang('ht', this)"><span>🇭🇹</span> Kreyòl</button>
            <button class="lang-option" onclick="setLang('en', this)"><span>🇺🇸</span> English</button>
            <button class="lang-option" onclick="setLang('es', this)"><span>🇪🇸</span> Español</button>
          </div>

          <div class="sidebar-section-title">Navigation</div>
          <nav class="sidebar-menu-nav">
            <a href="index.html" class="menu-link">
              <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
              <span id="nav-link-home">Accueil</span>
            </a>
            <div class="menu-link active" onclick="protectLink('commande.html')">
              <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              <span id="nav-link-history">Historique</span>
            </div>
            <div class="menu-link" onclick="protectLink('wallet.html')">
              <svg viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 01-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 002 2h14v-4"/><circle cx="16" cy="14" r="2"/></svg>
              <span id="nav-link-wallet">Wallet</span>
            </div>
            <a href="index.html#catalog-container" class="menu-link" onclick="closeSidebar()">
              <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
              <span id="nav-link-shop">Boutique</span>
            </a>
            <a href="help.html" class="menu-link">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span id="nav-link-support">Support</span>
            </a>
          </nav>

          <div class="sidebar-auth-zone" id="sidebar-auth-zone"></div>
        </div>
      </aside>
    </div>

  </div>

  <script>
    /* CONFIGURATION FIREBASE */
    const firebaseConfig = {
      apiKey: "AIzaSyDOSMtCknVXQs3XL1piE047Ussc6KeCDmY",
      authDomain: "digitalpayht-officiel.firebaseapp.com",
      projectId: "digitalpayht-officiel",
      storageBucket: "digitalpayht-officiel.firebasestorage.app",
      messagingSenderId: "492314684302",
      appId: "1:492314684302:web:dc36ab9445877df2dcd2df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let allOrders = [];
    let currentFilter = 'all';
    let currentLang = 'fr';

    const I18N = {

    function showToast(text, isDanger = false) {
      const container = document.getElementById('toast-container');
      container.innerHTML = '';
      const toast = document.createElement('div');
      toast.className = `toast-pro ${isDanger ? 'toast-danger' : ''}`;
      toast.innerHTML = `
        <svg class="icon-svg" viewBox="0 0 24 24" style="stroke:${isDanger ? '#FCA5A5' : '#10B981'};">
          ${isDanger 
            ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' 
            : '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>'}
        </svg>
        <span>${text}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 250);
      }, 2400);
    }

    function protectLink(url) {
      if (!currentUser) {
        showToast(I18N[currentLang].authRequired, true);
        setTimeout(() => window.location.href = "authentification/login.html", 1000);
      } else {
        window.location.href = url;
      }
    }

    function setLang(code, btn) {
      currentLang = code;
      document.querySelectorAll('.lang-option').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const dict = I18N[code];
      document.getElementById('txt-page-title').innerText = dict.pageTitle;
      document.getElementById('btn-filter-all').innerText = dict.filterAll;
      document.getElementById('btn-filter-pending').innerText = dict.filterPending;
      document.getElementById('btn-filter-delivered').innerText = dict.filterDelivered;

      document.getElementById('nav-link-home').innerText = dict.navHome;
      document.getElementById('nav-link-history').innerText = dict.navHistory;
      document.getElementById('nav-link-wallet').innerText = dict.navWallet;
      document.getElementById('nav-link-shop').innerText = dict.navShop;
      document.getElementById('nav-link-support').innerText = dict.navSupport;

      updateSidebarAuthUI();
      renderOrders();
      showToast(dict.toastLang);
    }

    function setOrdersFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    /* RENDU DES COMMANDES AVEC SÉCURITÉ PINS 24H */
    function renderOrders() {
      const target = document.getElementById('orders-container-target');
      const badge = document.getElementById('orders-count-badge');
      const dict = I18N[currentLang];

      badge.innerText = allOrders.length;

      let filtered = allOrders;
      if (currentFilter === 'en_attente') {
        filtered = allOrders.filter(o => o.status === 'en_attente' || o.status === 'en_attente_stock');
      } else if (currentFilter === 'livre') {
        filtered = allOrders.filter(o => o.status === 'livre');
      }

      if (filtered.length === 0) {
        target.innerHTML = `
          <div class="empty-orders-box">
            <svg viewBox="0 0 24 24">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="empty-title">${dict.emptyTitle}</div>
            <div class="empty-sub">${dict.emptySub}</div>
            <a href="index.html" class="btn-go-shop">${dict.btnShop}</a>
          </div>
        `;
        return;
      }

      target.innerHTML = '';
      filtered.forEach(ord => {
        const item = ord.item || {};
        const logo = item.logo || 'logo.png';
        const deliv = item.deliveryInfo || {};
        const orderTimestamp = ord.createdAtServer ? ord.createdAtServer.toMillis() : (ord.createdAt || Date.now());
        const dateStr = new Date(orderTimestamp).toLocaleDateString('fr-FR', {
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });

        // Détection expiration 24 heures pour le code PIN
        const isExpired24h = (Date.now() - orderTimestamp) > (24 * 3600 * 1000);

        let statusClass = "en_attente";
        let statusText = dict.statusPending;

        if (ord.status === "livre") { statusClass = "livre"; statusText = dict.statusDelivered; }
        else if (ord.status === "rejete") { statusClass = "rejete"; statusText = dict.statusRejected; }

        let delivRows = [];
        if (deliv.playerId) delivRows.push(`<div class="order-detail-line"><span class="order-detail-key">UID Joueur :</span><span class="order-detail-val">${deliv.playerId}</span></div>`);
        if (deliv.email) delivRows.push(`<div class="order-detail-line"><span class="order-detail-key">Email :</span><span class="order-detail-val">${deliv.email}</span></div>`);
        if (deliv.username) delivRows.push(`<div class="order-detail-line"><span class="order-detail-key">Utilisateur :</span><span class="order-detail-val">${deliv.username}</span></div>`);
        if (deliv.whatsapp) delivRows.push(`<div class="order-detail-line"><span class="order-detail-key">WhatsApp :</span><span class="order-detail-val">${deliv.whatsapp}</span></div>`);
        if (deliv.meruTag) delivRows.push(`<div class="order-detail-line"><span class="order-detail-key">Tag Meru :</span><span class="order-detail-val">${deliv.meruTag}</span></div>`);
        if (deliv.walletAddress) delivRows.push(`<div class="order-detail-line"><span class="order-detail-key">TRC20 :</span><span class="order-detail-val">${deliv.walletAddress}</span></div>`);

        // Zone Spéciale PIN Free Fire
        let pinZoneHtml = '';
        if (ord.pinCode && ord.status === 'livre') {
          if (!isExpired24h) {
            pinZoneHtml = `
              <div class="pin-vault-box">
                <div class="pin-vault-header">
                  <span class="pin-vault-label">${dict.pinTitle}</span>
                </div>
                <div class="pin-code-display">
                  <span>${ord.pinCode}</span>
                  <button class="btn-copy-pin" onclick="copyPinCode('${ord.pinCode}')">${dict.copyBtn}</button>
                </div>
                <a href="${ord.redeemUrl || 'https://redeem.hype.games/'}" target="_blank" rel="noopener noreferrer" class="btn-redeem-link">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="stroke:#FFFFFF;"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <span>${dict.redeemBtn}</span>
                </a>
              </div>
            `;
          } else {
            pinZoneHtml = `<div class="pin-expired-notice">${dict.pinExpired}</div>`;
          }
        }

        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-card-header">
            <div class="order-brand-zone">
              <div class="order-thumb">
                <img src="${logo}" alt="" onerror="this.src='assets/${logo}'; this.onerror=()=>{this.src='logo.png';};">
              </div>
              <div>
                <div class="order-item-title">${item.title || 'Produit DigitalPay'}</div>
                <div class="order-item-offer">${item.offerName || ''}</div>
              </div>
            </div>
            <div>
              <div class="order-price">${item.price ? item.price.toLocaleString() + ' HTG' : ''}</div>
              <span class="status-pill ${statusClass}">${statusText}</span>
            </div>
          </div>

          <div class="order-details-box">
            <div class="order-detail-line"><span class="order-detail-key">Réf Commande :</span><span class="order-detail-val"><code>${ord.orderId}</code></span></div>
            <div class="order-detail-line"><span class="order-detail-key">Date :</span><span class="order-detail-val">${dateStr}</span></div>
            <div class="order-detail-line"><span class="order-detail-key">Règlement :</span><span class="order-detail-val">${(ord.paymentMethod || 'Portefeuille').toUpperCase()}</span></div>
            ${delivRows.join('')}
          </div>

          ${pinZoneHtml}
        `;
        target.appendChild(card);
      });
    }

    function copyPinCode(pin) {
      navigator.clipboard.writeText(pin);
      showToast(I18N[currentLang].copied);
    }

    /* ÉCOUTE DES COMMANDES FIRESTORE */
    function listenToUserOrders() {
      db.collection('orders')
        .where('userId', '==', currentUser.uid)
        .onSnapshot(snapshot => {
          allOrders = [];
          snapshot.forEach(doc => allOrders.push(doc.data()));
          allOrders.sort((a, b) => {
            const timeA = a.createdAtServer ? a.createdAtServer.toMillis() : (a.createdAt || 0);
            const timeB = b.createdAtServer ? b.createdAtServer.toMillis() : (b.createdAt || 0);
            return timeB - timeA;
          });
          renderOrders();
        });
    }

    /* ÉCOUTE DES NOTIFICATIONS DU HEADER */
    function listenToBroadcastNotifications() {
      db.collection('system_config').doc('notifications').onSnapshot(doc => {
        const dot = document.getElementById('notif-dot');
        const heading = document.getElementById('notif-broadcast-heading');
        const text = document.getElementById('notif-broadcast-text');

        if (doc.exists && doc.data().active) {
          dot.style.display = 'block';
          heading.innerText = doc.data().title || "Annonce Administrateur";
          text.innerText = doc.data().message || "";
        } else {
          dot.style.display = 'none';
        }
      });
    }

    /* AUTHENTIFICATION */
    auth.onAuthStateChanged(user => {
      if (!user) {
        showToast(I18N[currentLang].authRequired, true);
        setTimeout(() => window.location.href = "authentification/login.html", 1000);
        return;
      }
      currentUser = user;
      updateSidebarAuthUI();
      listenToUserOrders();
      listenToBroadcastNotifications();
    });

    function updateSidebarAuthUI() {
      const container = document.getElementById('sidebar-auth-zone');
      const dict = I18N[currentLang];

      if (currentUser) {
        container.innerHTML = `
          <div style="font-size:12px; font-weight:800; color:var(--text-black); margin-bottom:2px;">
            ${currentUser.displayName || 'Client DigitalPay'}
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${currentUser.email}
          </div>
          <button class="btn-auth btn-logout" onclick="handleLogout()">
            ${dict.authLogout}
          </button>
        `;
      } else {
        container.innerHTML = `
          <a href="authentification/login.html" class="btn-auth btn-login">${dict.authLogin}</a>
          <a href="authentification/register.html" class="btn-auth btn-register">${dict.authRegister}</a>
        `;
      }
    }

    function handleLogout() {
      auth.signOut().then(() => window.location.href = "index.html");
    }

    function openSidebar() { document.getElementById('sidebar-overlay').classList.add('active'); }
    function closeSidebar() { document.getElementById('sidebar-overlay').classList.remove('active'); }
    function toggleNotifications() { document.getElementById('notif-panel').classList.toggle('open'); }

    window.addEventListener('DOMContentLoaded', () => {
      const cart = JSON.parse(localStorage.getItem('dp_cart') || '[]');
      document.getElementById('cart-indicator').innerText = cart.length;
      updateSidebarAuthUI();
    });
  </script>
