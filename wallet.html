<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portefeuille — DigitalPay Haiti</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    /* FINTECH DESIGN SYSTEM */
    :root {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --border: #E2E8F0;
      --border-light: #F1F5F9;

      --text-black: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;

      --royal-blue: #1D4ED8;
      --royal-gradient: linear-gradient(135deg, #1D4ED8 0%, #2563EB 50%, #3B82F6 100%);
      --royal-soft: rgba(29, 78, 216, 0.08);

      --danger: #DC2626;
      --danger-soft: rgba(220, 38, 38, 0.08);
      --success: #10B981;
      --success-soft: rgba(16, 185, 129, 0.08);
      --warning: #F59E0B;
      --warning-soft: rgba(245, 158, 11, 0.08);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-square: 16px;
      --radius-card: 18px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
      --shadow-balance: 0 10px 25px -3px rgba(29, 78, 216, 0.25);
      --shadow-sheet: 0 -10px 35px rgba(15, 23, 42, 0.12);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-black); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
    .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FFFFFF; position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-light); border-right: 1px solid var(--border-light); }
    .icon-svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; display: inline-block; vertical-align: middle; }

    /* HEADER */
    .site-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 10px 16px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
    .brand-logo-only { height: 34px; width: auto; max-width: 120px; object-fit: contain; cursor: pointer; }
    .header-icons { display: flex; align-items: center; gap: 6px; }
    .header-btn { width: 38px; height: 38px; border-radius: var(--radius-md); background: #FFFFFF; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-black); cursor: pointer; position: relative; text-decoration: none; transition: transform 0.15s ease; }
    .header-btn:active { transform: scale(0.94); background: var(--surface-subtle); }
    .header-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .badge-num { position: absolute; top: -3px; right: -3px; background: var(--royal-blue); color: #FFFFFF; font-size: 10px; font-weight: 800; width: 17px; height: 17px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF; }

    /* CORPS DU PORTEFEUILLE */
    .wallet-main { padding: 20px 16px 40px; flex: 1; display: flex; flex-direction: column; }

    /* CARTE SOLDE BLEU ROYAL HAUT DE GAMME */
    .balance-card {
      background: var(--royal-gradient);
      color: #FFFFFF;
      border-radius: var(--radius-card);
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-balance);
      position: relative;
      overflow: hidden;
    }

    .balance-card::after {
      content: '';
      position: absolute;
      right: -30px;
      top: -30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .balance-sub-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-amount-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 10px 0 16px;
    }

    .balance-val {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
    }

    .balance-currency {
      font-size: 16px;
      font-weight: 800;
      opacity: 0.9;
    }

    .balance-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 12px;
      font-size: 11px;
      font-weight: 600;
      opacity: 0.9;
    }

    /* BARRE D'ACTION HAUTE GAMME (LE BOUTON DÉPÔT PRO) */
    .wallet-actions-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn-action-deposit {
      height: 48px;
      background: var(--royal-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
      font-family: inherit;
      transition: transform 0.15s ease;
    }

    .btn-action-deposit:active {
      transform: scale(0.99);
    }

    /* HISTORIQUE TRANSACTIONS PRO */
    .section-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .section-heading {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-black);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tx-item {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--royal-blue);
      flex-shrink: 0;
    }

    .tx-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-black);
      line-height: 1.2;
    }

    .tx-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tx-right {
      text-align: right;
    }

    .tx-amount {
      font-size: 13px;
      font-weight: 900;
      color: var(--success);
    }

    .tx-status-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      display: inline-block;
      margin-top: 3px;
    }

    .tx-status-badge.valide { background: var(--success-soft); color: var(--success); }
    .tx-status-badge.en_attente { background: var(--warning-soft); color: var(--warning); }
    .tx-status-badge.rejete { background: var(--danger-soft); color: var(--danger); }

    .empty-tx-box {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    /* MODALE BOTTOM SHEET DU DÉPÔT */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 120;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .sheet-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .sheet-modal {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 100%);
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      background: #FFFFFF;
      border-radius: var(--radius-card) var(--radius-card) 0 0;
      z-index: 121;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sheet);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sheet-backdrop.active .sheet-modal {
      transform: translate(-50%, 0);
    }

    .sheet-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-black);
    }

    .sheet-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 800;
    }

    .sheet-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .deposit-methods-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .dep-pill {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      background: #FFFFFF;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-align: center;
    }

    .dep-pill.active {
      border-color: var(--royal-blue);
      background: var(--royal-soft);
    }

    .dep-pill-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .dep-pill-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-black);
    }

    .deposit-info-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 14px;
    }

    .dep-info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .dep-target-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .btn-copy-target {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--royal-blue);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .dep-target-value {
      font-family: monospace;
      font-size: 14px;
      font-weight: 900;
      color: var(--text-black);
      margin-bottom: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .text-input {
      width: 100%;
      height: 44px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-black);
      outline: none;
      font-family: inherit;
    }

    .text-input:focus {
      border-color: var(--royal-blue);
    }

    .sheet-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .btn-submit-deposit {
      width: 100%;
      height: 46px;
      background: var(--royal-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
      font-family: inherit;
    }

    .btn-submit-deposit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* TOAST */
    #toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300; width: calc(100% - 32px); max-width: 380px; pointer-events: none; }
    .toast-pro { background: #0F172A; color: #FFFFFF; padding: 12px 16px; border-radius: var(--radius-md); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); transform: translateY(-20px); opacity: 0; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .toast-pro.toast-danger { background: #991B1B; border-left: 4px solid #EF4444; }
    .toast-pro.show { transform: translateY(0); opacity: 1; }

    /* SIDEBAR */
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.25s ease; }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar-drawer { position: fixed; top: 0; right: 0; width: min(82vw, 340px); height: 100vh; background: #FFFFFF; z-index: 101; transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08); }
    .sidebar-overlay.active .sidebar-drawer { transform: translateX(0); }
    .sidebar-content { padding: 24px 20px; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
    .sidebar-header-pro { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .sidebar-brand-box { display: flex; align-items: center; gap: 12px; }
    .logo-container-square { width: 44px; height: 44px; border-radius: var(--radius-square); background: var(--surface-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .logo-container-square img { width: 100%; height: 100%; object-fit: contain; }
    .sidebar-brand-title { font-size: 16px; font-weight: 900; color: #000000; letter-spacing: -0.4px; }
    .sidebar-brand-sub { font-size: 12px; font-weight: 700; color: #000000; letter-spacing: 0.5px; }
    .sidebar-close-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; font-weight: 800; }
    .sidebar-section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-light); margin: 16px 0 8px; }
    .lang-switcher-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .lang-option { background: var(--surface-subtle); border: 1px solid var(--border); padding: 7px 10px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-black); cursor: pointer; }
    .lang-option.active { border-color: var(--royal-blue); background: var(--royal-soft); color: var(--royal-blue); font-weight: 800; }
    .sidebar-menu-nav { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
    .menu-link { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--radius-md); color: var(--text-black); text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.15s ease; cursor: pointer; }
    .menu-link:hover, .menu-link.active { background: var(--surface-subtle); color: var(--royal-blue); }
    .menu-link svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .sidebar-auth-zone { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn-auth { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; border-radius: var(--radius-md); font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn-logout { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.2); }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="app-shell">

    <!-- HEADER PRO -->
    <header class="site-header">
      <div class="header-top">
        <a href="index.html">
          <img src="logo.png" alt="DigitalPay Logo" class="brand-logo-only" onerror="this.src='assets/logo.png'; this.onerror=null;">
        </a>

        <div class="header-icons">
          <!-- Panier -->
          <a href="cart.html" class="header-btn" aria-label="Panier">
            <svg viewBox="0 0 24 24">
              <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="badge-num" id="cart-indicator">0</span>
          </a>

          <!-- Sidebar -->
          <button class="header-btn" onclick="openSidebar()" aria-label="Menu">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- CORPS DU PORTEFEUILLE ÉPURÉ -->
    <main class="wallet-main">

      <!-- CARTE SOLDE BLEU ROYAL -->
      <div class="balance-card">
        <div class="balance-sub-label">
          <span style="width:6px; height:6px; border-radius:50%; background:#38BDF8;"></span>
          <span id="i18n-balance-label">Solde Disponible</span>
        </div>
        <div class="balance-amount-row">
          <span class="balance-val" id="wallet-balance-val">0</span>
          <span class="balance-currency">HTG</span>
        </div>
        <div class="balance-footer">
          <span id="wallet-user-name">Chargement...</span>
          <span id="i18n-instant-status">Paiements 1-sec actifs</span>
        </div>
      </div>

      <!-- BOUTON DÉPOSER PRO -->
      <div class="wallet-actions-row">
        <button class="btn-action-deposit" onclick="openDepositModal()">
          <svg class="icon-svg" viewBox="0 0 24 24" style="stroke:#FFFFFF;"><path d="M12 4v16m8-8H4" stroke-linecap="round"/></svg>
          <span id="i18n-btn-open-deposit">Déposer des fonds</span>
        </button>
      </div>

      <!-- SECTION HISTORIQUE DES RECHARGES -->
      <div class="section-card">
        <div class="section-heading">
          <svg class="icon-svg" viewBox="0 0 24 24" style="stroke:var(--royal-blue);"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"/></svg>
          <span id="i18n-history-title">Historique des Recharges</span>
        </div>

        <div class="transactions-list" id="tx-history-target">
          <div class="empty-tx-box">Chargement de l'historique...</div>
        </div>
      </div>

    </main>

    <!-- SIDEBAR-MENU HAUT DE GAMME -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()">
      <aside class="sidebar-drawer" onclick="event.stopPropagation()">
        <div class="sidebar-content">
          
          <div class="sidebar-header-pro">
            <div class="sidebar-brand-box">
              <div class="logo-container-square">
                <img src="logo.png" alt="DigitalPay Logo" onerror="this.src='assets/logo.png'; this.onerror=null;">
              </div>
              <div>
                <div class="sidebar-brand-title">DigitalPay</div>
                <div class="sidebar-brand-sub">Haiti</div>
              </div>
            </div>
            <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
          </div>

          <div class="sidebar-section-title">Langue / Lang</div>
          <div class="lang-switcher-grid">
            <button class="lang-option active" onclick="setLang('fr', this)"><span>🇫🇷</span> Français</button>
            <button class="lang-option" onclick="setLang('ht', this)"><span>🇭🇹</span> Kreyòl</button>
            <button class="lang-option" onclick="setLang('en', this)"><span>🇺🇸</span> English</button>
            <button class="lang-option" onclick="setLang('es', this)"><span>🇪🇸</span> Español</button>
          </div>

          <div class="sidebar-section-title">Navigation</div>
          <nav class="sidebar-menu-nav">
            <a href="index.html" class="menu-link">
              <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
              <span id="nav-link-home">Accueil</span>
            </a>
            <a href="Commande.html" class="menu-link">
              <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              <span id="nav-link-history">Historique</span>
            </a>
            <a href="wallet.html" class="menu-link active">

    /* 4. TOAST NOTIFICATION */
    function showToast(text, isDanger = false) {
      const container = document.getElementById('toast-container');
      container.innerHTML = '';
      const toast = document.createElement('div');
      toast.className = `toast-pro ${isDanger ? 'toast-danger' : ''}`;
      toast.innerHTML = `
        <svg class="icon-svg" viewBox="0 0 24 24" style="stroke:${isDanger ? '#FCA5A5' : '#10B981'};">
          ${isDanger 
            ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' 
            : '<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>'}
        </svg>
        <span>${text}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 250);
      }, 2400);
    }

    /* 5. GESTION DES LANGUES */
    function setLang(code, btn) {
      currentLang = code;
      document.querySelectorAll('.lang-option').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const dict = I18N[code];
      document.getElementById('i18n-balance-label').innerText = dict.balanceLabel;
      document.getElementById('i18n-instant-status').innerText = dict.instantStatus;
      document.getElementById('i18n-btn-open-deposit').innerText = dict.btnOpenDeposit;
      document.getElementById('i18n-modal-dep-title').innerText = dict.modalDepTitle;
      document.getElementById('i18n-copy-btn').innerText = dict.copyBtn;
      document.getElementById('i18n-txid-label').innerText = dict.txidLabel;
      document.getElementById('i18n-proof-label').innerText = dict.proofLabel;
      document.getElementById('i18n-btn-deposit').innerText = dict.btnDeposit;
      document.getElementById('i18n-history-title').innerText = dict.historyTitle;

      document.getElementById('nav-link-home').innerText = dict.navHome;
      document.getElementById('nav-link-history').innerText = dict.navHistory;
      document.getElementById('nav-link-wallet').innerText = dict.navWallet;
      document.getElementById('nav-link-shop').innerText = dict.navShop;
      document.getElementById('nav-link-support').innerText = dict.navSupport;

      updateDepositMethodUI();
      showToast(dict.toastLang);

    /* 6. MODALE DE DÉPÔT */
    function openDepositModal() {
      document.getElementById('deposit-sheet-backdrop').classList.add('active');
    }

    function closeDepositModal() {
      document.getElementById('deposit-sheet-backdrop').classList.remove('active');
    }

    function selectDepositMethod(method) {
      selectedDepositMethod = method;
      document.querySelectorAll('.dep-pill').forEach(pill => {
        pill.classList.toggle('active', pill.dataset.method === method);
      });
      updateDepositMethodUI();
    }

    function updateDepositMethodUI() {
      const label = document.getElementById('dep-target-label');
      const val = document.getElementById('dep-target-value');
      const amountLabel = document.getElementById('i18n-amount-label');
      const input = document.getElementById('dep-amount-input');
      const hint = document.getElementById('meru-calc-hint');
      const dict = I18N[currentLang];

      input.value = "";
      hint.style.display = "none";

      if (selectedDepositMethod === 'moncash') {
        label.innerText = dict.targetPhone;
        val.innerText = "+509 3643-5649";
        amountLabel.innerText = dict.amountLabel;
        input.placeholder = "Ex: 1500";
      } else if (selectedDepositMethod === 'natcash') {
        label.innerText = dict.targetPhone;
        val.innerText = "+509 3566-9814";
        amountLabel.innerText = dict.amountLabel;
        input.placeholder = "Ex: 1500";
      } else if (selectedDepositMethod === 'meru') {
        label.innerText = dict.targetEmail;
        val.innerText = "lemarquis3944@gmail.com";
        amountLabel.innerText = dict.amountLabelMeru;
        input.placeholder = "Ex: 10 (USD)";
      }
    }

    function handleAmountInput(val) {
      const hint = document.getElementById('meru-calc-hint');
      if (selectedDepositMethod === 'meru') {
        const usd = parseFloat(val);
        if (!isNaN(usd) && usd > 0) {
          const htg = Math.round(usd * MERU_RATE);
          hint.innerText = `Crédit équivalent : ${htg} HTG (Taux 1$ = ${MERU_RATE} HTG)`;
          hint.style.display = "block";
        } else {
          hint.style.display = "none";
        }
      } else {
        hint.style.display = "none";
      }
    }

    function copyDepositTarget() {
      const target = document.getElementById('dep-target-value').innerText;
      navigator.clipboard.writeText(target);
      showToast(I18N[currentLang].copied);
    }

    function validateFileSize(input) {
      if (input.files && input.files[0]) {
        if (input.files[0].size > 1048576) {
          showToast(I18N[currentLang].fileTooLarge, true);
          input.value = "";
        }
      }
    }

    /* 7. SOUMISSION ET ENREGISTREMENT SANS PERTE */
    async function submitDepositRequest() {
      const amountInput = document.getElementById('dep-amount-input').value.trim();
      const txId = document.getElementById('dep-txid-input').value.trim();
      const proofFile = document.getElementById('dep-proof-file').files[0];
      const btn = document.getElementById('btn-submit-deposit');
      const dict = I18N[currentLang];

      const rawAmount = parseFloat(amountInput);
      if (isNaN(rawAmount) || rawAmount <= 0 || !txId || !proofFile) {
        showToast(dict.fillAllFields, true);
        return;
      }

      let creditHTG = rawAmount;
      if (selectedDepositMethod === 'meru') {
        creditHTG = Math.round(rawAmount * MERU_RATE);
      }

      btn.disabled = true;
      btn.innerText = "...";

      const depositId = "DEP-" + Math.floor(100000 + Math.random() * 900000);
      const newDeposit = {
        depositId: depositId,
        userId: currentUser.uid,
        userEmail: currentUser.email,
        method: selectedDepositMethod,
        depositedAmount: rawAmount,
        creditHTG: creditHTG,
        transactionId: txId,
        proofFileName: proofFile.name,
        status: "en_attente",
        createdAt: Date.now() // Timestamp JavaScript direct
      };

      try {
        // Enregistrement Firestore
        await db.collection('deposits').doc(depositId).set({
          ...newDeposit,
          createdAtServer: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Secours LocalStorage pour affichage immédiat sans index
        let localDeposits = JSON.parse(localStorage.getItem(`dp_dep_${currentUser.uid}`) || '[]');
        localDeposits.unshift(newDeposit);
        localStorage.setItem(`dp_dep_${currentUser.uid}`, JSON.stringify(localDeposits));

        btn.disabled = false;
        btn.innerText = dict.btnDeposit;
        document.getElementById('dep-amount-input').value = "";
        document.getElementById('dep-txid-input').value = "";
        document.getElementById('dep-proof-file').value = "";
        document.getElementById('meru-calc-hint').style.display = "none";

        closeDepositModal();
        showToast(dict.depositSubmitted);
        renderDepositsList(localDeposits);
      } catch (err) {
        btn.disabled = false;
        btn.innerText = dict.btnDeposit;
        showToast("Erreur d'enregistrement : " + err.message, true);
      }
    }

    /* 8. HISTORIQUE DES RECHARGES (SANS ERREUR D'INDEX COMPOSITE) */
    function renderDepositsList(deposits) {
      const target = document.getElementById('tx-history-target');
      const dict = I18N[currentLang];

      if (!deposits || deposits.length === 0) {
        target.innerHTML = `<div class="empty-tx-box">${dict.emptyHistory}</div>`;
        return;
      }

      target.innerHTML = '';
      deposits.forEach(data => {
        const dateStr = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : "Récent";
        
        let statusClass = "en_attente";
        let statusText = dict.statusPending;

        if (data.status === "valide") { statusClass = "valide"; statusText = dict.statusApproved; }
        else if (data.status === "rejete") { statusClass = "rejete"; statusText = dict.statusRejected; }

        const item = document.createElement('div');
        item.className = 'tx-item';
        item.innerHTML = `
          <div class="tx-left">
            <div class="tx-icon-circle">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round"/></svg>
            </div>
            <div>
              <div class="tx-title">Dépôt ${data.method ? data.method.toUpperCase() : 'MONCASH'}</div>
              <div class="tx-date">${dateStr} • Réf: ${data.depositId}</div>
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amount">+${data.creditHTG ? data.creditHTG.toLocaleString() : data.depositedAmount} HTG</div>
            <span class="tx-status-badge ${statusClass}">${statusText}</span>
          </div>
        `;
        target.appendChild(item);
      });
    }

    function listenToUserDeposits() {
      // 1. Affiche immédiatement le cache local
      let localDeposits = JSON.parse(localStorage.getItem(`dp_dep_${currentUser.uid}`) || '[]');
      renderDepositsList(localDeposits);

      // 2. Écoute Firestore sans orderBy pour éviter le crash d'index composite
      db.collection('deposits')
        .where('userId', '==', currentUser.uid)
        .onSnapshot(snapshot => {
          let list = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            list.push({
              ...data,
              createdAt: data.createdAtServer ? data.createdAtServer.toMillis() : (data.createdAt || Date.now())
            });
          });

          // Tri en mémoire JavaScript ultra-sécurisé
          list.sort((a, b) => b.createdAt - a.createdAt);
          localStorage.setItem(`dp_dep_${currentUser.uid}`, JSON.stringify(list));
          renderDepositsList(list);
        }, err => {
          console.warn("Firestore sync : utilisation du cache local", err);
        });
    }

    /* 9. AUTH ET CHARGEMENT DU SOLDE */
    auth.onAuthStateChanged(user => {
      if (!user) {
        showToast(I18N[currentLang].authRequired, true);
        setTimeout(() => window.location.href = "authentification/login.html", 1000);
        return;
      }

      currentUser = user;
      document.getElementById('wallet-user-name').innerText = user.displayName || user.email;

      // Écoute temps réel du solde utilisateur
      db.collection('users').doc(user.uid).onSnapshot(doc => {
        if (doc.exists) {
          currentBalance = doc.data().walletBalance || 0;
          document.getElementById('wallet-balance-val').innerText = currentBalance.toLocaleString();
        } else {
          document.getElementById('wallet-balance-val').innerText = "0";
        }
      });

      updateSidebarAuthUI();
      listenToUserDeposits();
    });

    function updateSidebarAuthUI() {
      const container = document.getElementById('sidebar-auth-zone');
      const dict = I18N[currentLang];

      if (currentUser) {
        container.innerHTML = `
          <div style="font-size:12px; font-weight:800; color:var(--text-black); margin-bottom:2px;">
            ${currentUser.displayName || 'Utilisateur DigitalPay'}
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${currentUser.email}
          </div>
          <button class="btn-auth btn-logout" onclick="handleLogout()">
            ${dict.authLogout}
          </button>
        `;
      }
    }

    function handleLogout() {
      auth.signOut().then(() => window.location.href = "index.html");
    }

    function openSidebar() { document.getElementById('sidebar-overlay').classList.add('active'); }
    function closeSidebar() { document.getElementById('sidebar-overlay').classList.remove('active'); }

    window.addEventListener('DOMContentLoaded', () => {
      const cart = JSON.parse(localStorage.getItem('dp_cart') || '[]');
      document.getElementById('cart-indicator').innerText = cart.length;
      updateDepositMethodUI();
    });
